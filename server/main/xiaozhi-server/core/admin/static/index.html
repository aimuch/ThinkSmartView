<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小麦网关 · 管理后台</title>
<link rel="icon" id="favicon" href="/admin/favicon">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='#6c8cff'/%3E%3Cstop offset='1' stop-color='#5ee0ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='18' fill='url(#g)'/%3E%3Cg transform='translate(8 7) scale(2)' fill='#fff'%3E%3Cpath d='M12 22V8.6' stroke='#fff' stroke-width='1.5' stroke-linecap='round' fill='none'/%3E%3Cpath d='M12 1.9 Q14.05 5 12 8.1 Q9.95 5 12 1.9Z'/%3E%3Cpath transform='translate(9.85 9.4) rotate(-30)' d='M0 -3.1 Q2.05 0 0 3.1 Q-2.05 0 0 -3.1Z'/%3E%3Cpath transform='translate(14.15 9.4) rotate(30)' d='M0 -3.1 Q2.05 0 0 3.1 Q-2.05 0 0 -3.1Z'/%3E%3Cpath transform='translate(9.75 13.3) rotate(-32)' d='M0 -3.1 Q2.05 0 0 3.1 Q-2.05 0 0 -3.1Z'/%3E%3Cpath transform='translate(14.25 13.3) rotate(32)' d='M0 -3.1 Q2.05 0 0 3.1 Q-2.05 0 0 -3.1Z'/%3E%3Cpath transform='translate(9.7 17.2) rotate(-34)' d='M0 -3.1 Q2.05 0 0 3.1 Q-2.05 0 0 -3.1Z'/%3E%3Cpath transform='translate(14.3 17.2) rotate(34)' d='M0 -3.1 Q2.05 0 0 3.1 Q-2.05 0 0 -3.1Z'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root {
    --side: #0f172a; --side-text: #94a3b8; --side-hover: #1e293b; --side-line: #1e293b;
    --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; --muted: #64748b; --line: #e2e8f0; --field: #ffffff; --soft: #f8fafc;
    /* [xiaozhi-hub] 小麦的品牌蓝（设备 client/web/v2/tokens.css 的 --accent #6c8cff），浅色底上加深一档，白字按钮够对比度 */
    --accent: #3f5fe0; --btn: #3f5fe0; --btn-hover: #3350c8; --accent-soft: #eef1ff; --accent-line: #c5d0ff;
    --ai: linear-gradient(120deg, #a78bfa, #6c8cff 55%, #38c8f0); --ai-fill: linear-gradient(120deg, #7c4dea, #4a5ae8 55%, #1477b3);
    --ai-soft: #7c5cf014; --ai-soft-ink: #5a48d6; --ai-soft-line: #7c5cf033;
    --ok: #059669; --ok-soft: #ecfdf5; --warn: #b45309; --warn-soft: #fffbeb; --err: #dc2626; --err-soft: #fef2f2;
    --shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 1px 3px rgba(15, 23, 42, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      /* [xiaozhi-hub] 设计画布第 14 块：中性深灰（参考 UniFi），蓝色只给强调和选中 */
      --side: #131417; --side-hover: #1e1f23; --side-line: #2a2c31;
      --bg: #0e0f11; --card: #17181b; --text: #e8e9ec; --muted: #8b8f98; --line: #2a2c31; --field: #111214; --soft: #1b1c20;
      --accent: #7aa2ff; --btn: #4f7cff; --btn-hover: #3f6cf0; --accent-soft: #1b2440; --accent-line: #34407a;
      --ai-soft: #8b7bff22; --ai-soft-ink: #b9adff; --ai-soft-line: #8b7bff44;
      --ok: #3ecf74; --ok-soft: #12291c; --warn: #f5a524; --warn-soft: #2b2110; --err: #f2555a; --err-soft: #2e1517;
      --shadow: none;
    }
  }
  /* [xiaozhi-hub] 「界面」里选了深色：不管系统 */
  :root[data-theme="dark"] {
      /* [xiaozhi-hub] 设计画布第 14 块：中性深灰（参考 UniFi），蓝色只给强调和选中 */
      --side: #131417; --side-hover: #1e1f23; --side-line: #2a2c31;
      --bg: #0e0f11; --card: #17181b; --text: #e8e9ec; --muted: #8b8f98; --line: #2a2c31; --field: #111214; --soft: #1b1c20;
      --accent: #7aa2ff; --btn: #4f7cff; --btn-hover: #3f6cf0; --accent-soft: #1b2440; --accent-line: #34407a;
      --ai-soft: #8b7bff22; --ai-soft-ink: #b9adff; --ai-soft-line: #8b7bff44;
      --ok: #3ecf74; --ok-soft: #12291c; --warn: #f5a524; --warn-soft: #2b2110; --err: #f2555a; --err-soft: #2e1517;
      --shadow: none;
    }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
         color: var(--text); background: var(--bg); }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--accent); }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  .hidden { display: none !important; }

  /* ---------- 布局 ---------- */
  .app { display: grid; grid-template-columns: var(--side-w, 232px) minmax(0, 1fr); min-height: 100vh; }
  aside { background: var(--side); color: var(--side-text); padding: 20px 14px; position: sticky; top: 0; height: 100vh;
          display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 10px; color: #fff; font-weight: 600; font-size: 15px; padding: 0 8px 22px; }
  .logo { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, #6c8cff, #5ee0ff);
          display: grid; place-items: center; font-size: 18px; font-weight: 700; color: #fff; flex: none; overflow: hidden; }
  .logo svg { width: 82%; height: 82%; display: block; }
  .logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .logo.img { background: none; }
  .logo.xl { width: 60px; height: 60px; border-radius: 16px; font-size: 34px; }
  .nav button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; border: 0;
                background: none; color: inherit; cursor: pointer; text-align: left; margin-bottom: 2px; }
  .nav button:hover { background: var(--side-hover); color: #e2e8f0; }
  .nav button.active { background: var(--side-hover); color: #fff; box-shadow: inset 3px 0 0 #818cf8; }
  /* 图标放在圆角小方块里（设计画布第 28 块）；图标本身由脚本换成线条 SVG */
  .nav button { gap: 12px; padding: 6px 8px; }
  .nav .ico { width: 30px; height: 30px; border-radius: 9px; background: #ffffff0f; display: grid; place-items: center; flex: none; font-size: 15px; }
  .nav .ico svg { width: 18px; height: 18px; display: block; }
  .nav button.active .ico { background: color-mix(in srgb, var(--accent) 30%, transparent); color: #fff; }
  .nav button.active { box-shadow: none; }
  /* 拖动调宽度、一键折叠 */
  aside { position: sticky; }
  .side-resize { position: absolute; top: 0; bottom: 0; right: -4px; width: 8px; cursor: col-resize; z-index: 3; touch-action: none; }
  .side-resize::after { content: ""; position: absolute; left: 3px; top: 0; bottom: 0; width: 2px; background: var(--accent); opacity: 0; transition: opacity .15s; }
  .side-resize:hover::after, .side-resize.drag::after { opacity: .8; }
  .side-col { margin-left: auto; width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--side-line); background: none;
              color: var(--side-text); display: grid; place-items: center; cursor: pointer; font-size: 13px; flex: none; }
  .side-col:hover { background: var(--side-hover); color: #fff; }
  .side-foot { margin-top: auto; font-size: 12px; padding: 12px 10px 0; border-top: 1px solid var(--side-line); }
  .side-foot button { background: none; border: 0; padding: 0; color: inherit; text-decoration: underline; cursor: pointer; }
  .side-foot .row { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
  .side-foot a { color: inherit; text-decoration: none; }
  .side-foot a:hover { color: #e2e8f0; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #64748b; margin-right: 6px; vertical-align: 1px; }
  .dot.on { background: #34d399; box-shadow: 0 0 0 3px rgba(52, 211, 153, .2); }
  .dot.off { background: #f87171; }
  #online-short { display: none; }
  main { padding: 28px 36px 72px; max-width: 1080px; width: 100%; }

  /* ---------- 通用元素 ---------- */
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  h1 { font-size: 22px; margin: 0; }
  .sub { color: var(--muted); margin: 4px 0 0; }
  .pill { display: inline-block; font-size: 12px; padding: 1px 10px; border-radius: 999px; font-weight: 500; white-space: nowrap;
          background: var(--soft); color: var(--muted); border: 1px solid var(--line); }
  .pill.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
  /* AI 相关（设计画布第 45 块）：默认模型实心渐变，称呼淡紫色 */
  .pill.ai { background: var(--ai-fill); color: #fff; border-color: transparent; font-weight: 600; }
  .pill.ai-soft, #cn-models .chip.on { background: var(--ai-soft); color: var(--ai-soft-ink); border-color: var(--ai-soft-line); }
  .btn.primary.ai { background: var(--ai-fill); border-color: transparent; }
  .btn.primary.ai:hover:not(:disabled) { filter: brightness(1.08); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
  .pill.err { background: var(--err-soft); color: var(--err); border-color: transparent; }
  .section-title { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .03em; margin: 28px 0 10px;
                   display: flex; align-items: center; gap: 8px; }
  .section-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
  .card + .card { margin-top: 12px; }
  .panel { padding: 20px 22px; }
  .choices + .card, .vendors + .card { margin-top: 12px; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 22px;
               border-bottom: 1px solid var(--line); }
  .card-head h2 { font-size: 15px; margin: 0; }
  .card-head h2.with-logo { display: flex; align-items: center; gap: 10px; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .banner { padding: 10px 14px; border-radius: 10px; margin-bottom: 14px; font-size: 13px; }
  .banner.warn { background: var(--warn-soft); color: var(--warn); }
  .banner.err { background: var(--err-soft); color: var(--err); }
  .banner.info { background: var(--accent-soft); color: var(--accent); }

  /* 表单 */
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 20px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px 20px; }
  .full { grid-column: 1 / -1; }
  label.f { display: block; font-size: 13px; font-weight: 500; }
  label.f .hint { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 6px; }
  .in { width: 100%; margin-top: 6px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--field); }
  .in:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .seg { display: inline-flex; margin-top: 6px; background: var(--soft); border: 1px solid var(--line); border-radius: 8px; padding: 3px; }
  .seg button { padding: 5px 18px; border-radius: 6px; color: var(--muted); cursor: pointer; border: 0; background: none; }
  .seg button:hover:not(.on) { color: var(--text); }
  .seg button.on { background: var(--btn); color: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px; background: var(--card); }
  .chip.on { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }
  .chip.risky { border-style: dashed; }
  .chip-x { border: 0; background: none; color: inherit; cursor: pointer; padding: 0 0 0 4px; font-size: 14px; line-height: 1; }
  .chip.risky.on { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
  .cli-row { display: grid; grid-template-columns: 6em minmax(0, 1fr); gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); align-items: start; }
  .cli-row:first-child { border-top: 0; padding-top: 0; }
  .cli-k { font-weight: 500; padding-top: 9px; }
  .cli-row .seg { margin-top: 0; flex-wrap: wrap; }
  .cli-row .seg button { padding: 6px 14px; line-height: 1.3; }
  .cli-row .seg button small { display: block; font-size: 11px; color: var(--muted); font-weight: 400; }
  .cli-row .seg button.on small { color: rgba(255, 255, 255, .85); }
  #model-custom { margin-top: 8px; }
  .levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .level { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; text-align: left; background: var(--card); cursor: pointer; }
  .level b { display: block; font-size: 14px; }
  .level small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .level.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .level.auto.on { border-color: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }
  .switch { display: flex; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; cursor: pointer; }
  .switch input { width: 16px; height: 16px; accent-color: var(--accent); }
  .switch small { color: var(--muted); font-size: 12px; }
  details.adv { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 14px; }
  details.adv summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  details.adv[open] summary { margin-bottom: 14px; }
  .actions { display: flex; gap: 10px; justify-content: flex-end; align-items: center; margin-top: 20px; flex-wrap: wrap; }
  .actions .result { margin-right: auto; font-size: 13px; }
  .btn { position: relative; padding: 8px 18px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: var(--accent-line); }
  .btn.primary { background: var(--btn); border-color: var(--btn); color: #fff; }
  .btn.primary:hover { background: var(--btn-hover); }
  .btn.sm { padding: 4px 12px; font-size: 13px; }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn.busy { color: transparent !important; opacity: 1; }
  .btn.busy::after { content: ""; position: absolute; inset: 0; margin: auto; width: 14px; height: 14px; border-radius: 50%;
                     border: 2px solid var(--muted); border-right-color: transparent; animation: spin .8s linear infinite; }
  .btn.primary.busy::after { border-color: #fff; border-right-color: transparent; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 选择卡片 */
  .choices { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .choices.three { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }  /* 放得下才三列，否则两列 */
  .choice { padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); display: flex; gap: 14px;
            text-align: left; box-shadow: var(--shadow); }
  button.choice { cursor: pointer; }
  .choice.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .choice.off { opacity: .55; cursor: not-allowed; }
  .choice .mark { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; flex: none; font-size: 17px; }
  .choice b { font-size: 15px; } .choice small { display: block; color: var(--muted); word-break: break-all; }
  /* 模型图标（设计画布第 42 块）：白底圆角小方块，单色（黑）的图标深色主题下也看得清；Kimi 本身是白的垫深蓝；没有图标用名字第一个字 */
  .mlogo { width: 30px; height: 30px; border-radius: 8px; padding: 5px; background: #fff; box-shadow: inset 0 0 0 1px #0000000f;
          flex: none; object-fit: contain; display: grid; place-items: center; font-weight: 700; font-size: 14px; line-height: 1; }
  .mlogo.dk { background: #10142a; box-shadow: inset 0 0 0 1px #ffffff24; }
  .mlogo.let { background: var(--accent-soft); color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent-line); }
  .mlogo.lg { width: 40px; height: 40px; border-radius: 10px; padding: 7px; font-size: 17px; }
  .mlogo.md { width: 34px; height: 34px; border-radius: 10px; padding: 6px; font-size: 15px; }
  .vendors { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .vendor { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--card); cursor: pointer;
            position: relative; text-align: left; box-shadow: var(--shadow); display: flex; gap: 10px; align-items: center; min-width: 0; }
  .vendor > span { min-width: 0; }
  .vendor.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .vendor b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 8px; }
  .vendor small { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .vendor i { position: absolute; top: 12px; right: 12px; width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
  .vendor i.set { background: var(--ok); }
  /* 默认的那家：AI 渐变描边、「✓ 默认」渐变实心（设计画布第 45 块；绿色只留给右上角「配好了」的小点） */
  .vendor.using { border-color: transparent; }
  .vendor.using::before { content: ""; position: absolute; inset: -1px; border-radius: inherit; padding: 2px; background: var(--ai); pointer-events: none;
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
  .vendor.using.on { box-shadow: 0 0 0 3px var(--accent-soft); }
  .vendor.using small { display: inline-block; margin-top: 2px; padding: 0 8px; border-radius: 999px; background: var(--ai-fill); color: #fff; font-weight: 600; }
  .vendor.using i { width: 8px; height: 8px; box-shadow: 0 0 0 3px rgba(5, 150, 105, .18); }

  /* 状态页 */
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .tile { padding: 14px 16px; text-align: left; cursor: pointer; }
  .tile:hover { border-color: var(--accent-line); }
  .tile .k { color: var(--muted); font-size: 12px; }
  .tile .v { font-weight: 600; font-size: 15px; margin-top: 2px; word-break: break-all; }
  .tile .d { color: var(--muted); font-size: 12px; }
  .kv { display: grid; grid-template-columns: max-content minmax(0, 1fr) max-content; gap: 8px 14px; align-items: center; }
  .kv .k { color: var(--muted); }
  .kv code { word-break: break-all; }
  .rows > div { display: flex; gap: 12px; align-items: center; padding: 10px 22px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .rows > div:first-child { border-top: 0; }
  .rows b { min-width: 7.5em; font-weight: 500; }
  .device { padding: 14px 22px; border-top: 1px solid var(--line); }
  .device:first-child { border-top: 0; }
  .device-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .emogrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; margin-top: 12px; }
  .emo { border: 1px solid var(--line); border-radius: 10px; background: var(--soft); padding: 8px 4px; cursor: pointer; text-align: center; }
  .emo:hover { border-color: var(--accent-line); }
  .emo.now { border-color: var(--accent); background: var(--accent-soft); }
  .emo span { display: block; font-size: 22px; line-height: 1.2; }
  .emo small { color: var(--muted); font-size: 11px; }

  /* 音色 */
  .voice-group + .voice-group { margin-top: 18px; }
  .wa-card { margin-bottom: 16px; } .wa-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; } .wa-head > b { font-size: 15px; }
  .wa-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; } .wa-row.off { opacity: .5; }
  .wa-hist { display: grid; grid-template-columns: 60px 1fr; gap: 4px 12px; margin-top: 10px; } .wa-win { color: var(--ok); font-weight: 600; }
  .cmd-head-acts { display: flex; align-items: center; gap: 14px; }
  .cmd-devs { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
  .cmd-dev { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
  .cmd-cat { display: grid; grid-template-columns: 170px 1fr 260px; gap: 12px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
  .cmd-alias, .cmd-try { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; } .cmd-alias .in, .cmd-try .in { flex: 1; }
  .cmd-rule { display: flex; flex-direction: column; gap: 8px; padding: 12px 0; border-top: 1px solid var(--line); }
  .cmd-rule-top, .cmd-rule-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  .clone-card { margin-top: 18px; }

  /* 侧栏底部（第 14 块 B）：在线状态 + 账号菜单 */

  .hb { --hb: var(--muted); margin: 0 0 8px; padding: 8px 10px; border: 1px solid color-mix(in srgb, var(--hb) 28%, transparent); border-radius: 10px; color: var(--hb); }

  /* [xiaozhi-hub] 费用 */

  .dv-sec > .t { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; }
  .dv-sec > .t .seg { margin: 0 0 0 auto; } .dv-sec > .t .seg button { padding: 3px 10px; font-size: 12px; }
  .dv-sec .body { margin-top: 8px; } .dv-sec .body.hidden { display: none; }
  .dv-sec textarea.in { min-height: 96px; resize: vertical; font-size: 13px; line-height: 1.6; }
  .dv-sec .chips { margin-top: 6px; }
  .dv-sec .chip { cursor: pointer; }
  /* [xiaozhi-hub] 插件按设备开关（设计画布第 40 块） */
  .pd-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
  .pd-chip { border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; font-size: 12px; background: var(--card); color: var(--text); cursor: pointer; line-height: 1.6; }
  .pd-chip.on { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }
  .pd-chip.off { background: var(--soft); color: var(--muted); text-decoration: line-through; text-decoration-color: var(--err); }
  .pd-chip.add { border-style: dashed; color: var(--muted); background: none; }
  .pd-chip:hover { border-color: var(--accent-line); }
  .pd-pop { position: fixed; z-index: 60; width: 340px; max-width: calc(100vw - 24px); background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, .28); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .pd-pop .h { font-weight: 600; } .pd-pop .h small { font-weight: 400; color: var(--muted); margin-left: 6px; }
  .pd-row { display: flex; align-items: center; gap: 8px; }
  .pd-row > span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pd-row > span small { display: block; font-size: 11.5px; color: var(--muted); }
  .seg.pd-seg { margin: 0; flex: none; padding: 2px; }
  .seg.pd-seg button { padding: 3px 10px; font-size: 12px; }
  .seg.pd-seg button.on.inh { background: var(--line); color: var(--text); box-shadow: none; }
  .pd-list .pd-row { padding: 6px 0; border-top: 1px solid var(--line); }
  .pd-list .pd-row:first-child { border-top: 0; }
  .pd-list .pd-row.ch > span > b { color: var(--accent); }
  .pd-list .pd-row > span > b { font-weight: 500; }
  @media (max-width: 520px) { .pd-list .pd-row { flex-wrap: wrap; } .pd-list .pd-row .seg { margin-left: auto; } }

  /* ---------- [xiaozhi-hub] 费用分析（设计画布第 20 块，参考 CPA Manager Plus） ---------- */
  .c-tabs { display: flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); width: max-content; margin-bottom: 12px; }
  .c-tabs button { border: 0; background: none; color: var(--muted); padding: 6px 14px; border-radius: 7px; cursor: pointer; font: inherit; font-size: 13px; }
  .cn-say { display: grid; grid-template-columns: 1fr 20px 1fr 20px 1.2fr; align-items: stretch; gap: 6px; padding: 12px !important; margin-bottom: 16px; }
  .cn-say > i { font-style: normal; display: grid; place-items: center; color: var(--muted); }
  .cn-say .seg { border-radius: 10px; padding: 9px 11px; display: flex; flex-direction: column; gap: 4px; border: 1px solid var(--line); background: var(--soft); }
  .cn-say .seg b { font-size: 15px; } .cn-say .seg small { color: var(--muted); font-size: 11px; line-height: 1.55; }
  .cn-say .tag { font-size: 11px; font-weight: 600; letter-spacing: .5px; color: var(--muted); }
  .cn-say .ww { border-color: color-mix(in srgb, var(--warn) 45%, transparent); background: color-mix(in srgb, var(--warn) 8%, transparent); } .cn-say .ww .tag { color: var(--warn); }
  .cn-say .cn { border-color: var(--accent-line); background: var(--accent-soft); } .cn-say .cn .tag { color: var(--accent); }
  @media (max-width: 900px) { .cn-say { grid-template-columns: 1fr; } .cn-say > i { transform: rotate(90deg); } }
  .c-tabs button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .c-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .c-bar .seg { margin: 0; } .c-bar .seg button { padding: 4px 11px; font-size: 12px; }
  .c-bar select.in, .c-bar input.in { margin: 0; width: auto; padding: 5px 8px; font-size: 12px; }
  .c-heat-bar > .seg, .c-heat-bar > input, .c-heat-bar > .cmp { display: none; }   /* 热力图固定看最近 4 周：只留筛选 */
  .c-bar .cmp { margin-left: auto; color: var(--muted); font-size: 12px; }
  .c-kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
  .c-kpis .u-stat b { font-size: 22px; }
  .c-up { color: var(--err); } .c-down { color: var(--ok); } .c-flat { color: var(--muted); }
  .c-series { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
  .c-series button { border: 1px solid var(--line); background: none; color: var(--muted); border-radius: 7px; padding: 2px 9px; font-size: 11px; cursor: pointer; display: flex; gap: 5px; align-items: center; }
  .c-series button i { width: 8px; height: 8px; border-radius: 2px; }
  .c-series button.on { color: var(--text); border-color: var(--accent-line); }
  .c-chart { width: 100%; height: 210px; display: block; }
  .c-axis { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; margin-top: 2px; }
  .c-two { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 12px; }
  .c-two .u-table th, .c-two .u-table td { padding: 9px 10px; } .c-two .u-table th:first-child, .c-two .u-table td:first-child { padding-left: 16px; }
  .c-two .u-table .c-share { width: 56px; } .c-two > .card { overflow-x: auto; }
  .c-share { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; width: 90px; } .c-share i { display: block; height: 100%; background: var(--accent); }
  .c-split { display: flex; height: 22px; border-radius: 6px; overflow: hidden; margin: 6px 0 10px; background: var(--line); }
  .c-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }
  .c-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .c-heat { display: grid; grid-template-columns: 40px repeat(24, minmax(0, 1fr)); gap: 3px; font-size: 11px; color: var(--muted); align-items: center; }
  .c-heat i { height: 22px; border-radius: 3px; background: var(--accent); display: block; }
  .u-table tr[data-rank] { cursor: pointer; } .u-table tr[data-rank]:hover td { background: var(--soft); }
  @media (max-width: 900px) { .c-kpis { grid-template-columns: 1fr 1fr; } .c-two { grid-template-columns: 1fr; } }
</style>
</head>
<body>

    <div class="auth-top"><div class="logo xl" data-logo></div><h2 data-brand-name>小麦网关</h2><p id="auth-sub">输入管理后台密码</p></div>
    <input type="text" name="username" value="admin" autocomplete="username" class="hidden" tabindex="-1">
    <div id="auth-setup" class="hidden">
      <label class="f">设置密码（至少 6 位）<div class="pw"><input class="in" id="setup-pw" type="password" autocomplete="new-password"><button type="button" class="eye" data-eye="setup-pw">显示</button></div></label>
      <div class="meter" id="pw-meter"><i></i><i></i><i></i><i></i></div>

    </div>
    <div id="auth-login" class="hidden">
      <label class="f">密码<div class="pw"><input class="in" id="login-pw" type="password" autocomplete="current-password"><button type="button" class="eye" data-eye="login-pw">显示</button></div></label>
    </div>

    <div class="brand"><div class="logo" data-logo></div><span data-brand-name>小麦网关</span><button class="side-col" id="side-col" type="button" title="收起侧栏">‹‹</button></div>

    <div class="side-foot"><div class="sf-box">
      <div class="side-status hb" id="hb" data-st="none"><svg class="hb-ico" viewBox="0 0 24 24" aria-hidden="true"><g class="hb-live"><circle class="hb-dot" cx="12" cy="12" r="2"/><path d="M8.2 8.2a5.4 5.4 0 0 0 0 7.6M15.8 8.2a5.4 5.4 0 0 1 0 7.6M5.3 5.3a9.5 9.5 0 0 0 0 13.4M18.7 5.3a9.5 9.5 0 0 1 0 13.4"/></g><g class="hb-alert"><circle cx="12" cy="12" r="2"/><path d="M8.2 8.2a5.4 5.4 0 0 0 0 7.6M15.8 8.2a5.4 5.4 0 0 1 0 7.6M5.3 5.3a9.5 9.5 0 0 0 0 13.4M18.7 5.3a9.5 9.5 0 0 1 0 13.4M3.5 3.5l17 17"/></g></svg>
        <span class="hb-txt"><b id="online-text">没有设备在线</b></span><span id="online-short">无设备</span>
        </div>
      <small class="sf-sub" id="hb-sub"></small>
      <button class="acct" id="acct-btn" aria-haspopup="menu" title="账号：界面、名称和图标、修改密码、退出登录"><span class="av" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20.5c.8-4 3.8-6 7.5-6s6.7 2 7.5 6"/></svg></span><span class="sf-who">管理员 · <span id="acct-sub">已登录</span></span></button>

        <button type="button" data-th="light" title="浅色"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
        <button type="button" data-th="dark" title="深色"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function toast(msg, isError, ms) {
  toast.count = (toast.count || 0) + 1;
  const t = $("toast");
  t.textContent = msg;
  t.className = "show" + (isError ? " err" : "");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => (t.className = isError ? "err" : ""), ms || (isError ? 6000 : 3000));
}

// quiet：后台定时查询用。登录过期时如果页面上有没保存的修改，不跳到登录页（会清掉这些修改），只抛出错误
async function api(path, body, quiet) {
  const opts = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
  let res;
  try { res = await fetch("/admin/api/" + path, opts); } catch (e) { throw new Error("连不上服务，请确认服务还在运行"); }
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (res.status === 401 && path !== "login") {
    if (quiet && page.dirty && page.dirty()) { const e = new Error(EXPIRED); e.expired = true; throw e; }
    page.dirty = null; await route(); throw new Error(EXPIRED + "，请重新登录");
  }
  if (!res.ok || data.ok === false) throw new Error(data.error || ("请求失败：" + res.status));
  return data;
}

// 按钮执行期间显示转圈并禁用，避免重复点击；保存超过半秒（写配置、重建模型要几秒）再提示一句
async function busy(btn, fn) {
  if (btn.disabled) return;
  btn.disabled = true; btn.classList.add("busy");
  const hint = btn.textContent.includes("保存") ? "正在保存，请稍等…" : "";
  const shown = toast.count;   // the hint never covers the result once it has been shown
  const timer = hint && setTimeout(() => toast.count === shown && toast(hint, false, 60000), 500);
  try { return await fn(); } finally {
    clearTimeout(timer);
    if (hint && $("toast").textContent === hint) $("toast").className = "";   // 结果没另行提示时收起
    btn.disabled = false; btn.classList.remove("busy");
  }
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) {  // 局域网 http 页面没有剪贴板权限，退回旧办法
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove();
  }
  toast("已复制");
}

// 记录表单初始值，用来判断"有没有改过"
function snapshot(fn) { const first = JSON.stringify(fn()); return () => JSON.stringify(fn()) !== first; }

// ---------- 登录与页面切换 ----------

// ---------- [xiaozhi-hub] 名称和图标（设计画布第 14 块 E、F） ----------
const WHEAT_LEAVES = [[9.6, 9.6, -30], [14.4, 9.6, 30], [9.5, 13.8, -32], [14.5, 13.8, 32], [9.4, 18, -34], [14.6, 18, 34]];
function wheatSvg() {
  return `<svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M12 22.5V8.6" stroke="#fff" stroke-width="1.7" stroke-linecap="round" fill="none"/>`
    + `<path d="M12 1.4Q14.3 4.9 12 8.3Q9.7 4.9 12 1.4Z"/>`
    + WHEAT_LEAVES.map(([x, y, r]) => `<path transform="translate(${x} ${y}) rotate(${r})" d="M0 -3.4Q2.3 0 0 3.4Q-2.3 0 0 -3.4Z"/>`).join("") + "</svg>";
}
function logoHtml(icon) {
  if (icon && icon.kind === "emoji") return esc(icon.value);
  if (icon && icon.kind === "image") return `<img src="${esc(icon.value)}" alt="">`;
  return wheatSvg();
}
let brandInfo = { name: "小麦网关", icon: { kind: "wheat" }, repo_url: "", repo_label: "" };
function applyBrand(b) {
  if (b) brandInfo = b;
  document.querySelectorAll("[data-logo]").forEach((el) => { el.innerHTML = logoHtml(brandInfo.icon); el.classList.toggle("img", brandInfo.icon.kind === "image"); });
  document.querySelectorAll("[data-brand-name]").forEach((el) => (el.textContent = brandInfo.name));
  const title = PAGE_TITLES[page.name];
  document.title = brandInfo.name + (title ? " · " + title : " · 管理后台");
  $("favicon").href = "/admin/favicon?v=" + encodeURIComponent(brandInfo.icon.kind + (brandInfo.icon.value || "").length + brandInfo.icon.value.slice(-12));
}
const PAGE_TITLES = { status: "状态", how: "工作原理", llm: "大模型", calls: "称呼", grokbot: "Grok Bot", agents: "智能体", devices: "设备", memory: "记忆", cost: "费用",
  asr: "语音识别", tts: "语音合成", intent: "意图识别", update: "更新网关" };

let authMode = "login";
async function route() {
  let st;
  try { st = await (await fetch("/admin/api/state")).json(); } catch (e) { return; }
  if (st.brand) applyBrand(st.brand);
  $("auth-foot").textContent = `${st.host || location.host} · ${st.online ? st.online + " 台设备在线" : "没有设备在线"}`;
  if (st.session_expires) $("acct-sub").textContent = st.session_expires - Date.now() / 1000 > 86400
    ? `保持到 ${new Date(st.session_expires * 1000).toLocaleDateString("zh-CN", { month: "numeric", day: "numeric" })}` : "关掉浏览器要重新登录";
  if (st.needs_setup || !st.logged_in) {
    authMode = st.needs_setup ? "setup" : "login";
    clearInterval(page.timer); page.name = ""; applyBrand();
    clearInterval(onlineTimer); onlineTimer = null;
    $("app").classList.add("hidden"); $("auth").classList.remove("hidden");
    $("auth-setup").classList.toggle("hidden", authMode !== "setup");
    $("auth-login").classList.toggle("hidden", authMode !== "login");
    $("auth-btn").textContent = authMode === "setup" ? "设置并进入" : "登录";
    $("auth-sub").textContent = authMode === "setup" ? "第一次使用，先设置一个后台密码" : "输入管理后台密码";
    $("auth-error").classList.add("hidden");
    $(authMode === "setup" ? "setup-pw" : "login-pw").focus();
    return;
  }
  $("auth").classList.add("hidden"); $("app").classList.remove("hidden");
  expiredWarned = false;
  watchOnline();
  await openPage(currentPage(), true);
}

$("auth-form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const fail = (msg) => { $("auth-error").textContent = msg; $("auth-error").classList.remove("hidden"); };
  await busy($("auth-btn"), async () => {
    try {
      if (authMode === "setup") {
        if ($("setup-pw").value.length < 6) return fail("密码至少 6 位");
        if ($("setup-pw").value !== $("setup-pw2").value) return fail("两次输入的密码不一致");
        await api("setup", { password: $("setup-pw").value, remember: $("auth-remember").checked });
      } else {
        await api("login", { password: $("login-pw").value, remember: $("auth-remember").checked });
        $("login-pw").value = "";
      }
      await route();
    } catch (e) { fail(e.message); }
  });
});
document.querySelectorAll("[data-eye]").forEach((b) => (b.onclick = () => {
  const el = $(b.dataset.eye), show = el.type === "password";
  el.type = show ? "text" : "password"; b.textContent = show ? "隐藏" : "显示"; el.focus();
}));
$("setup-pw").addEventListener("input", () => {   // 粗略的强度：长度、字母数字混合、符号
  const v = $("setup-pw").value;
  const score = (v.length >= 6) + (v.length >= 10) + (/[a-z]/i.test(v) && /\d/.test(v)) + /[^a-z0-9]/i.test(v);
  $("pw-meter").querySelectorAll("i").forEach((i, n) => i.classList.toggle("on", n < score));
});

// 账号菜单（侧栏底部）：界面、名称和图标、修改密码、仓库链接、退出登录
function openAcctMenu() {
  closeAcctMenu();
  const r = $("acct-btn").getBoundingClientRect();
  const m = document.createElement("div");
  m.className = "acct-menu"; m.id = "acct-menu"; m.setAttribute("role", "menu");
  m.innerHTML = `<button data-m="ui">界面<span>主题、布局、菜单</span></button>
    <button data-m="brand">名称和图标<span>${esc(brandInfo.name)}</span></button>
    <button data-m="pw">修改密码</button>
    ${brandInfo.repo_url ? `<a href="${esc(brandInfo.repo_url)}" target="_blank" rel="noopener">${esc(brandInfo.repo_label || "仓库")} ↗<span>仓库</span></a>` : ""}
    <hr><button data-m="out" class="out">退出登录</button>`;
  document.body.appendChild(m);
  const top = Math.max(8, r.top - m.offsetHeight - 6);
  m.style.left = Math.min(r.left, innerWidth - m.offsetWidth - 8) + "px";
  m.style.top = (r.top > m.offsetHeight + 12 ? top : r.bottom + 6) + "px";
  m.querySelector('[data-m="ui"]').onclick = () => { closeAcctMenu(); $("ui-btn").click(); };

// devices 为 null 表示查不到（连不上服务、登录过期）：不能停在上一次的结果上，否则服务停了还显示"1 台设备在线"
// [xiaozhi-hub] dev 是 /devices 的结果（带 seen：心跳算出的 对话中/待机/离线），或只有在连接的设备数组（呼名页）。
// 设备只在对话时连着网关，所以「在线」按心跳算：对话中是绿点，待机是琥珀点（设计画布第 14 块 B）
let lastSeen = [];

// 或只有在连接的设备数组（呼名页）；null 是连不上服务或登录过期。

function hbTick() {

  const hm = (t, sec) => new Date(t * 1000).toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit", ...(sec ? { second: "2-digit" } : {}), hour12: false });
  if (hb.st === "idle" || hb.st === "slow") {
    const st = age > 30 ? "slow" : "idle";
    if (st !== $("hb").dataset.st) $("hb").dataset.st = st;
    sub.textContent = `待机 · 心跳 ${age < 2 ? "刚刚" : age + " 秒前"}`;
  } else if (hb.st === "talk") sub.textContent = `${hb.name ? hb.name + " · " : ""}对话中`;
  else if (hb.st === "none") sub.textContent = hb.lastOff ? `最近：${hb.lastOff.name} · ${hm(hb.lastOff.t)}` : "设备待机时每 10 秒心跳";

function duration(sec) {

const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

function countUp(el) {
  const target = Number(el.dataset.count), fmt = (v) => (el.dataset.dec ? v.toFixed(+el.dataset.dec) : Math.round(v)) + (el.dataset.unit || "");
  if (REDUCED || !isFinite(target) || target === 0) { el.textContent = (el.dataset.pre || "") + fmt(target || 0); return; }
  const t0 = performance.now(), ease = (x) => 1 - Math.pow(1 - x, 4);
  const step = (t) => { const x = Math.min(1, (t - t0) / 480); el.textContent = (el.dataset.pre || "") + fmt(target * ease(x)); if (x < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

  $("copy-ota").onclick = () => copyText(s.addresses.ota);
  $("refresh").onclick = (e) => busy(e.target, () => openPage("status", true));
  renderDevices(dev);
  // 平时每 5 秒查一次；有设备在做表情测试时每 1.5 秒查一次，让进度跟上设备屏幕
  let last = Date.now();
  page.timer = setInterval(async () => {
    const testing = (lastDevices?.devices || []).some((d) => d.emotion_test && d.emotion_test.running);
    if (document.hidden || (!testing && Date.now() - last < 5000)) return;
    last = Date.now();
    try { const d = await api("devices", undefined, true); setOnline(d); renderDevices(d); }
    catch (e) { onDevicesError(e); if (isOffline(e)) devicesOffline(); }
  }, 1500);
}

let lastDevices = null;  // 最近一次查到的设备，状态页据此决定多久再查
// 连不上服务时不能继续显示上一次的列表，否则侧边栏说"连不上服务"，这里还列着设备
function devicesOffline() {
  const box = $("devices");
  if (!box || box.dataset.key === "offline") return;
  box.dataset.key = "offline";
  box.innerHTML = '<div class="panel muted">连不上服务，设备列表暂停更新。服务恢复后会自动刷新。</div>';
}
const STATE_PILL = { talking: '<span class="spill">对话中</span>', idle: '<span class="spill idle">待机</span>', offline: '<span class="spill off">离线</span>' };
function renderDevices(dev) {
  lastDevices = dev;
  const box = $("devices");
  if (!box) return;
  const conn = Object.fromEntries((dev.devices || []).map((d) => [d.device_id, d]));
  const rows = (dev.seen || []).length ? dev.seen : (dev.devices || []).map((d) => ({ device_id: d.device_id, state: "talking", last_seen: dev.now }));
  if (deviceDrawer) renderDeviceDrawer(dev);
  if (!rows.length) {
    box.dataset.key = "";
    box.innerHTML = '<div class="panel muted">还没有设备。设备开机后 10 秒内出现在这里（客户端 0.1.625 起；更早的版本只在对话时出现）。</div>';
    return;
  }
  const key = JSON.stringify(rows.map((r) => [r.device_id, r.name, r.state, r.version, (conn[r.device_id] || {}).model_label, (conn[r.device_id] || {}).session_id]));
  if (box.dataset.key === key) {  // 只更新时间，避免重绘打断点击
    box.querySelectorAll("[data-ago]").forEach((el) => (el.textContent = ago(dev.now, +el.dataset.ago)));
    box.querySelectorAll("[data-since]").forEach((el) => (el.textContent = duration(dev.now - +el.dataset.since)));
    return;
  }
  box.dataset.key = key;
  box.innerHTML = `<table class="u-table"><tr><th>设备</th><th>状态</th><th>当前模型</th><th>版本</th><th>最近</th><th></th></tr>
    ${rows.map((r) => { const c = conn[r.device_id]; return `<tr>
      <td title="${esc(r.device_id)}">${r.name ? `<b style="font-weight:600">${esc(r.name)}</b><div class="mono muted" style="font-size:11px">${esc(r.device_id)}</div>` : `<span class="mono">${esc(r.device_id || "未知设备")}</span>`}${c && c.home ? `<div class="muted small">${esc(c.home)}</div>` : ""}</td>
      <td>${STATE_PILL[r.state] || ""}</td><td>${esc(c ? c.model_label || "默认" : "—")}</td><td class="mono">${esc(r.version || "—")}</td>
      <td>${c ? `<span data-since="${c.connected_at}">${duration(dev.now - c.connected_at)}</span>` : `<span data-ago="${r.last_seen}">${ago(dev.now, r.last_seen)}</span>`}</td>
      <td>${c ? `<button class="btn sm" data-sid="${esc(c.session_id)}">详情 ›</button>` : ""}</td></tr>`; }).join("")}</table>`;
  box.querySelectorAll("[data-sid]").forEach((b) => (b.onclick = () => {
    deviceDrawer = b.dataset.sid;
    openDrawer("", "");
    openDrawer.onclose = () => { deviceDrawer = null; };
    renderDeviceDrawer(lastDevices);
  }));
}

// 在线设备的详情（设计画布第 9 块 C）：模型、住宅地址、连接时长、表情测试
let deviceDrawer = null;
function renderDeviceDrawer(dev) {
  const d = (dev.devices || []).find((x) => x.session_id === deviceDrawer);
  if (!d) { $("drawer-title").textContent = "设备已断开"; $("drawer-body").innerHTML = '<p class="muted">这台设备已经断开连接。</p>'; return; }
  const t = d.emotion_test, running = t && t.running, url = `devices/${encodeURIComponent(d.session_id)}/`;
  const progress = !t ? "点一个表情单独发送，或者依次播放全部，对照设备屏幕看哪些有变化。"
    : running ? `正在依次播放：第 ${t.index}/${t.total} 个 ${t.emoji} ${esc(t.emotion)}`
    : t.stopped ? `已停止（播放到第 ${t.index}/${t.total} 个）。` : "依次播放已结束。";
  const sig = JSON.stringify([d.session_id, d.model_label, d.home, t]);
  $("drawer-title").textContent = d.device_id || "未知设备";
  if ($("drawer-body").dataset.sig === sig) {
    $("drawer-body").querySelectorAll("[data-since]").forEach((el) => (el.textContent = duration(dev.now - +el.dataset.since)));
    return;
  }
  $("drawer-body").dataset.sig = sig;
  $("drawer-body").innerHTML = `
    <div class="dkv"><span>当前模型</span><b>${esc(d.model_label || "默认")}</b><span>住宅地址</span><b>${esc(d.home || "没设（用「查天气」里的设备所在地）")}</b>
      <span>IP</span><b class="mono">${esc(d.ip || "")}</b><span>连接时长</span><b data-since="${d.connected_at}">${duration(dev.now - d.connected_at)}</b></div>
    <div><b>表情测试</b><p class="muted small" style="margin:6px 0 0">${progress}</p>
      <div class="emogrid">${dev.emotions.map((e) => `<button class="emo ${running && t.emotion === e.emotion ? "now" : ""}" data-emo="${e.emotion}">
        <span>${e.emoji}</span><small>${esc(e.label)}</small></button>`).join("")}</div>
      <div class="actions" style="justify-content:flex-start">
        <button class="btn sm primary" data-act="all" ${running ? "disabled" : ""}>依次播放全部（每个 2 秒）</button>
        <button class="btn sm" data-act="stop" ${running ? "" : "disabled"}>停止</button></div></div>`;
  const body = $("drawer-body"), refresh = async () => { body.dataset.sig = ""; renderDevices(await api("devices")); };
  body.querySelector('[data-act="all"]').onclick = (e) => busy(e.target, async () => {
    try { await api(url + "emotion-test", {}); await refresh(); } catch (err) { toast(err.message, true); } });
  body.querySelector('[data-act="stop"]').onclick = (e) => busy(e.target, async () => {
    try { await api(url + "emotion-test/stop", {}); await refresh(); } catch (err) { toast(err.message, true); } });
  body.querySelectorAll("[data-emo]").forEach((b) => (b.onclick = async () => {
    try { await api(url + "emotion", { emotion: b.dataset.emo }); toast(`已发送 ${b.querySelector("span").textContent} ${b.dataset.emo}`); await refresh(); }
    catch (err) { toast(err.message, true); }
  }));
}

const SOURCE_PILL = { "服务端": "ok", "Claude Code": "warn" };
let selStage = 3;   // 默认选中「大模型」
async function renderHow(root) {
  const d = await api("pipeline");
  const f = d.flow, p = d.prompt, m = p.marks;
  const markRe = new RegExp(`${m.start}(\\w+)${m.sep}([\\s\\S]*?)${m.end}`, "g");
  const highlight = (text) => esc(text).replace(markRe, (_, name, value) => {
    const label = p.var_labels[name] || name;
    if (name === "base_prompt") return `<mark class="persona"><i>${esc(label)}</i>${value}</mark>`;
    return value.trim() ? `<mark title="${esc(name)}"><i>${esc(label)}</i>${value}</mark>` : `<mark title="${esc(name)}"><i>${esc(label)}</i>（空）</mark>`;
  });
  const plain = (text) => text.replace(markRe, (_, name, value) => value);
  const stage = (s) => {
    const body = `<div class="ico">${s.icon}</div><b>${esc(s.title)}</b><span class="mod">${esc(s.value)}</span><small>${esc(s.hint)}</small>`;
    return s.page ? `<button class="stage" data-go="${esc(s.page)}" title="去设置">${body}</button>` : `<div class="stage static">${body}</div>`;
  };
  // 设计画布第 14 块 D：唤醒 → 收音 → 识别 → 大模型 → 合成 → 播放，上方小字标在哪里发生
  const by = Object.fromEntries(f.stages.map((x) => [x.id, x]));

  const stages = [{ id: "wake", icon: "◉", title: "唤醒", value: "「小麦小麦」", hint: "设备上的唤醒词，网关再听一遍确认；唤醒词在设备的设置里改", where: "设备", page: null },
    { ...by.listen, where: "设备 → 网关" }, { ...by.asr, where: cloud(by.asr) ? "网关 → 云端" : "网关" },
    { ...by.llm, where: lan(by.llm) ? "网关 → 局域网" : /DSH|Claude/.test(by.llm.value) ? "网关上的智能体" : "网关 → 云端" },
    { ...by.tts, where: cloud(by.tts) ? "网关 → 云端" : "网关" }, { ...by.play, where: "设备" }].filter((x) => x.title);
  if (selStage >= stages.length) selStage = 0;
  root.innerHTML = `
    <div class="page-head"><div><h1>工作原理</h1><p class="sub">说一句话之后会发生什么、可以怎么跟它说话。内容按当前配置生成，修改设置后会跟着变。</p></div></div>
    <div class="card u-panel" style="margin-top:0!important"><div class="h">一句话怎么走<span>点一步看说明，再点「去设置」</span></div>
      <div class="hflow">${stages.map((x, i) => `<button class="hstage ${i === selStage ? "sel" : ""}" data-stage="${i}" style="animation-delay:${i * 40}ms">
        <span class="where">${esc(x.where)}</span><span class="i">${x.icon}</span><b>${esc(x.title)}</b><span class="v">${esc(x.value)}</span></button>`).join("")}</div>
      ${(f.branches || []).length ? `<div class="hbranch">${f.branches.map((b) => `<div ${b.page ? `data-go="${esc(b.page)}" style="cursor:pointer"` : ""}><b>${esc(b.title)}</b>${esc(b.text)}</div>`).join("")}</div>` : ""}
      <div class="hdetail" id="hdetail"></div></div>

    <div class="section-title">怎么跟它说话</div>
    <div class="tips">${f.tips.map((t) => `<div class="card tip"><b>${esc(t.title)}</b>
      <div class="say">${esc(t.say)}</div><div class="res">${esc(t.result)}</div></div>`).join("")}</div>

    <div class="section-title">发给大模型的提示词 <span class="muted small" style="font-weight:400">调人设、排查回答不对劲时用得上</span></div>
    <details class="prompt-all">
      <summary class="card"><b>发给 ${esc(p.llm)} 的内容</b><span class="pill">${p.segments.length} 段，按顺序拼在一起</span>
        <span class="toggle">展开 / 收起</span></summary>
      ${p.warnings.map((w) => `<div class="banner warn">${esc(w)}</div>`).join("")}
      ${p.segments.map((s, i) => `<details class="card seg-card pseg" ${s.collapsed ? "" : "open"}>
        <summary class="seg-head"><span class="no">${i + 1}</span><b>${esc(s.title)}</b>
          <span class="pill ${SOURCE_PILL[s.source] ?? ""}">来源：${esc(s.source)}</span><span class="pill">${esc(s.when)}</span>
          <span class="toggle">展开 / 收起</span></summary>
        <p class="seg-note">${esc(s.note)}</p>
        ${s.text ? `<pre class="prompt-text">${highlight(s.text)}</pre>
          <div class="actions" style="margin:0;padding:0 22px 14px"><button class="btn sm" data-copyseg="${i}">复制这段</button></div>` : ""}
      </details>`).join("")}
      ${p.actual ? `<details class="card seg-card pseg"><summary class="seg-head"><b>在线设备 ${esc(p.actual.device_id || "")} 实际使用的系统提示词</b>
          <span class="toggle">展开 / 收起</span></summary>
        <p class="seg-note">这是这台设备连接时真正生成的版本（第 ${p.segments.findIndex((s) => s.id === "base") + 1} 段），可以和上面的预览对照。</p>
        <pre class="prompt-text">${esc(p.actual.text)}</pre></details>` : ""}
    </details>

    <p class="how-foot">每一步为什么这样设计、连接和 Claude Code 进程什么时候启动和关闭、哪些记录会保存，见 GitHub 上的
      <a href="${esc(d.design_url)}" target="_blank" rel="noopener">设计细节 ↗</a>。</p>`;
  const detail = () => {
    const x = stages[selStage];
    $("hdetail").innerHTML = `<b>${esc(x.title)}</b><span>${esc(x.value)}${x.hint ? " · " + esc(x.hint) : ""}</span>
      ${x.page ? `<button class="btn sm" data-go="${esc(x.page)}">去设置 ›</button>` : ""}`;
    $("hdetail").querySelectorAll("[data-go]").forEach((b) => (b.onclick = () => openPage(b.dataset.go)));
  };
  root.querySelectorAll("[data-stage]").forEach((b) => (b.onclick = () => {
    selStage = +b.dataset.stage; root.querySelectorAll("[data-stage]").forEach((y) => y.classList.toggle("sel", y === b)); detail();
  }));
  detail();
  root.querySelectorAll("[data-go]").forEach((b) => (b.onclick = () => openPage(b.dataset.go)));
  root.querySelectorAll("[data-copyseg]").forEach((b) => (b.onclick = () => copyText(plain(p.segments[+b.dataset.copyseg].text))));

  void customModel;
  box.querySelectorAll("[data-vision]").forEach((b) => (b.onclick = () => { visionPick = b.dataset.vision; renderVision(box); }));
  $("vision-save").onclick = (ev) => busy(ev.target, async () => {
    try {
      await api("vision", { provider: p.id, api_key: $("vision-key").value.trim(), model: $("vision-model").value.trim(), url: $("vision-url").value.trim() });
      toast("看图模型已保存"); renderVision(box);
    } catch (err) { toast(err.message, true); }
  });
  if ($("vision-fetch")) $("vision-fetch").onclick = (ev) => busy(ev.target, () => fetchModels($("vision-url").value, $("vision-key").value, p.id === "ollama" ? "ollama" : "", $("vision-list"), $("vision-model"), true));
  $("vision-test").onclick = (ev) => busy(ev.target, async () => {
    const out = $("vision-result"), t0 = performance.now();
    out.textContent = "正在问看图模型…"; out.className = "result muted";
    try {
      const r = await api("vision/test", {});
      const sec = ((performance.now() - t0) / 1000).toFixed(1);
      out.textContent = r.ok ? `✓ ${r.message}（${sec} 秒）` : "✗ " + r.error;
      out.className = "result"; out.style.color = r.ok ? "var(--ok)" : "var(--err)";
    } catch (err) { out.textContent = "✗ " + err.message; out.style.color = "var(--err)"; }
  });
}

// 问 OpenAI 兼容服务（Ollama、LM Studio 等）有哪些模型，点一个填进 input（设计画布第 15 块 C）
async function fetchModels(url, key, vendor, listBox, input, visionFirst) {
  listBox.innerHTML = '<span class="muted small">正在读取…</span>';
  try {
    const r = await api("models/list", { url: url.trim(), api_key: (key || "").trim(), vendor });
    const models = visionFirst ? [...r.models].sort((a, b) => (b.vision ? 1 : 0) - (a.vision ? 1 : 0)) : r.models;
    listBox.innerHTML = models.map((m) => `<button type="button" class="chip ${m.id === input.value ? "on" : ""}" data-m="${esc(m.id)}">${esc(m.id)}${m.size ? ` <span class="muted small">${esc(m.size)}</span>` : ""}${m.vision ? ' <span class="muted small">能看图</span>' : ""}</button>`).join("");
    listBox.querySelectorAll("[data-m]").forEach((b) => (b.onclick = () => {
      input.value = b.dataset.m; listBox.querySelectorAll(".chip").forEach((c) => c.classList.toggle("on", c === b));
      input.dispatchEvent(new Event("input"));
    }));
  } catch (err) { listBox.innerHTML = `<span class="small" style="color:var(--err)">${esc(err.message)}</span>`; }
}

// 各卡片分别保存；保存后重新打开本页，显示服务端整理后的结果。own 是这张卡片的“有没有修改”检查
let asrChecks = [];
const saveAndReload = (target, path, body, own) => {
  if (asrChecks.some((f) => f && f !== own && f())
      && !confirm("其他卡片还有没保存的修改，保存这里后页面会刷新，那些修改会丢掉。继续吗？")) return;
  return busy(target, async () => {
    try { const r = await api(path, body); toast(r.note, r.failed); page.dirty = null; await openPage("asr", true); }
    catch (err) { toast(err.message, true); }
  });
};

function bindVad(v) {
  if (!v.supported) return null;
  const input = $("vad-silence");
  const dirty = () => input.value.trim() !== String(v.silence_ms);
  $("vad-save").onclick = (e) => saveAndReload(e.target, "vad", { silence_ms: input.value.trim() }, dirty);
  return dirty;
}

// ---------- 热词 ----------

function hotwordsCard(h) {
  return `
    <div class="card" style="margin-top:16px">
      <div class="card-head"><h2>热词</h2><span class="pill">${h.words.length + h.auto.length} 个</span></div>
      <div class="panel ${h.supported ? "" : "disabled-area"}">
        <p style="margin:0">容易认错的专有名词，识别时优先考虑，比如 GitHub、StackChan。只能把发音接近的词救回来；发音完全一样的（Claude 总被听成 cloud），用下面的“识别后纠错”。
          写原本的大小写，一个词一项，不要太多（几十个以内），太多反而容易误认。</p>
        <div class="chips" id="hw-chips"></div>
        ${h.auto.length ? `<p class="muted small" style="margin:10px 0 0">虚线的来自<a href="#calls">称呼</a>里的模型名字，自动带上，在称呼页修改。</p>` : ""}
        ${h.dropped.length ? `<div class="banner warn" style="margin:10px 0 0">豆包一次最多带约 100 个 token 的热词，超出了，这 ${h.dropped.length} 个不会带上：${esc(h.dropped.join("、"))}。称呼页里的模型名字会优先带上。</div>` : ""}
        <div style="display:flex;gap:8px;margin-top:12px;max-width:440px">
          <input class="in" id="hw-new" placeholder="添加热词，回车确认" ${h.supported ? "" : "disabled"}><button class="btn sm" id="hw-add" ${h.supported ? "" : "disabled"}>添加</button></div>
        <div class="actions"><span class="result muted">${h.supported ? "保存后重新加载语音识别：新连接马上生效，在线设备重新连接后生效。" : "当前语音识别不支持热词，支持的有本地 X-ASR、豆包。"}</span>
          <button class="btn primary" id="hw-save" ${h.supported ? "" : "disabled"}>保存热词</button></div>
      </div>
    </div>`;
}

function bindHotwords(h) {
  if (!h.supported) return null;
  const words = [...h.words];
  const draw = () => {
    $("hw-chips").innerHTML = words.map((w, i) => `<span class="chip on">${esc(w)}
        <button class="chip-x" data-del="${i}" title="删除" aria-label="删除 ${esc(w)}">×</button></span>`).join("")
      + h.auto.map((w) => `<span class="chip risky" title="来自称呼页">${esc(w)}</span>`).join("")
      || '<span class="muted small">还没有热词</span>';
    $("hw-chips").querySelectorAll("[data-del]").forEach((b) => (b.onclick = () => { words.splice(+b.dataset.del, 1); draw(); }));
  };
  const add = () => {
    const input = $("hw-new"), w = input.value.replace(/\s+/g, " ").trim();
    if (!w) return;
    if (/[,，]/.test(w)) { toast("一个词一项，不要用逗号", true); return; }
    if (![...words, ...h.auto].some((x) => x.toLowerCase() === w.toLowerCase())) words.push(w);
    input.value = ""; draw();
  };
  $("hw-add").onclick = add;
  $("hw-new").onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); add(); } };
  const dirty = () => JSON.stringify(words) !== JSON.stringify(h.words) || !!$("hw-new").value.trim();
  $("hw-save").onclick = (e) => saveAndReload(e.target, "asr/hotwords", { words }, dirty);
  draw();
  return dirty;
}

function bindCorrections(list) {
  const items = list.map((x) => ({ target: x.target, aliases: [...x.aliases] }));
  const original = JSON.stringify(items);
  const card = $("cor-card");
  const draw = () => {
    card.innerHTML = `
      <div class="card-head"><h2>识别后纠错</h2><span class="pill">${items.length} 条</span></div>
      <div class="panel">
        <p style="margin:0">识别出文字后，把认错的写法换成正确的，再交给大模型和设备显示。不区分大小写，中英文之间有没有空格都算；英文按整词替换，“cloud code” 不会改到 “cloud coder” 里。
          认错的写法至少 2 个字，太短容易误改普通的话。</p>
        ${items.map((it, i) => `
          <div class="cor-row" data-row="${i}" style="border-top:1px solid var(--line);margin-top:14px;padding-top:12px">
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
              <span class="muted small">改成</span><input class="in" data-target value="${esc(it.target)}" style="max-width:220px">
              <button class="btn sm" data-del-row title="删除这一条">删除</button></div>
            <div class="chips">${it.aliases.map((a, j) => `<span class="chip on">${esc(a)}
              <button class="chip-x" data-del="${j}" title="删除" aria-label="删除 ${esc(a)}">×</button></span>`).join("")}</div>
            <div style="display:flex;gap:8px;margin-top:10px;max-width:440px">
              <input class="in" data-new placeholder="再加一种认错的写法"><button class="btn sm" data-add>添加</button></div>
          </div>`).join("")}
        <div style="border-top:1px solid var(--line);margin-top:14px;padding-top:12px">
          <div class="section-title" style="margin-top:0">新增一条</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
            <input class="in" id="cor-alias" placeholder="认错的写法，如 cloud code" style="max-width:240px">
            <span class="muted small">改成</span>
            <input class="in" id="cor-target" placeholder="正确写法，如 Claude Code" style="max-width:240px">
            <button class="btn sm" id="cor-add">添加</button></div>
        </div>
        <div class="actions"><span class="result muted">保存后马上生效，在线设备不用重新连接。</span>
          <button class="btn primary" id="cor-save">保存纠错表</button></div>
      </div>`;
    card.querySelectorAll("[data-row]").forEach((row) => {
      const it = items[+row.dataset.row];
      row.querySelector("[data-target]").oninput = (e) => { it.target = e.target.value; };
      row.querySelector("[data-del-row]").onclick = () => { items.splice(+row.dataset.row, 1); draw(); };
      row.querySelectorAll("[data-del]").forEach((b) => (b.onclick = () => { it.aliases.splice(+b.dataset.del, 1); draw(); }));
      const input = row.querySelector("[data-new]");
      const add = () => { const a = input.value.trim(); if (a && !it.aliases.some((x) => x.toLowerCase() === a.toLowerCase())) it.aliases.push(a); draw(); };
      row.querySelector("[data-add]").onclick = add;
      input.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); add(); } };
    });
    $("cor-add").onclick = () => {
      const alias = $("cor-alias").value.trim(), target = $("cor-target").value.trim();
      if (!alias || !target) { toast("认错的写法和正确写法都要填", true); return; }
      const same = items.find((x) => x.target.toLowerCase() === target.toLowerCase());
      if (same) { if (!same.aliases.some((x) => x.toLowerCase() === alias.toLowerCase())) same.aliases.push(alias); }
      else items.push({ target, aliases: [alias] });
      draw();
    };
    $("cor-save").onclick = (e) => saveAndReload(e.target, "asr/corrections", { items }, dirty);
  };
  const dirty = () => JSON.stringify(items) !== original || !!($("cor-alias").value.trim() || $("cor-target").value.trim());
  draw();
  return dirty;
}

// ---------- 语音合成 ----------

let audio = null;
let ttsView = null;
async function renderTTS(root) {
  const d = await api("tts");
  const engines = Object.fromEntries((d.engines || []).map((e) => [e.id, e]));
  if (!ttsView || !engines[ttsView]) ttsView = engines[d.engine] ? d.engine : "edge";
  const e = engines[ttsView];
  const isQwen = e.id === "qwen3", isLan = !!e.custom;
  let chosen = e.voice || (e.voices[0] && e.voices[0].value);
  const groups = [];
  e.voices.forEach((v) => { let g = groups.find((x) => x.name === v.group); if (!g) groups.push(g = { name: v.group, items: [] }); g.items.push(v); });
  const curEngine = engines[d.engine];
  const cur = d.voices.find((v) => v.value === d.voice);
  const tag = (x) => x.using ? '<span class="pill ok">使用中</span>' : x.configured ? '<span class="pill">已配置</span>' : '<span class="pill">未配置</span>';
  root.innerHTML = `
    <div class="page-head"><div><h1>语音合成</h1><p class="sub">把回复转成语音。一次只用一种，选好引擎和音色后保存即可切换。</p></div>
      <span class="pill ok">当前：${esc(curEngine ? curEngine.label : d.selected)}${cur ? ` · ${esc(cur.name)}` : ""}</span></div>
    ${d.engine === "other" ? `<div class="banner warn">当前使用的 ${esc(d.selected)} 不在后台管理范围内（可能是手动改了配置文件）。在下面选一种并保存即可切换。</div>` : ""}
    <div class="choices">${(d.engines || []).map((x) => `
      <button class="choice ${ttsView === x.id ? "on" : ""}" data-engine="${esc(x.id)}">
        <div class="mark" style="background:${x.id === "edge" ? "var(--accent-soft);color:var(--accent)" : "#fff7ed;color:#c2410c"}">${x.id === "edge" ? "E" : x.custom ? "LAN" : "千"}</div>
        <div><b>${esc(x.label)}</b> ${tag(x)}<small>${esc(x.mark)} · ${esc(x.desc)}</small></div></button>`).join("")}</div>
    <div class="card panel">
      ${e.conflict ? `<div class="banner err">配置里已有一个叫 ${esc(e.entry)} 的条目，但类型不对，请在配置文件里改名或删掉它。</div>` : ""}
      ${isQwen ? `<div class="grid2"><label class="f">百炼 API Key
          <input class="in mono" id="tts-key" type="password" autocomplete="off"
            placeholder="${e.key_set ? `已设置 ${esc(e.key_hint)}，输入新值可替换` : "未设置，粘贴后保存"}"></label></div>
        <p class="muted small" style="margin:8px 0 14px">在<a href="${esc(e.link)}" target="_blank" rel="noopener">百炼控制台</a>创建 API Key（sk- 开头）。Key 只保存在这台电脑的配置文件里，页面上只显示首尾 4 位。保存 Key 之后才能试听。</p>` : ""}
      ${isLan ? `<div class="grid2">
          <label class="f full">接口地址<span class="hint">OpenAI 兼容的 /v1/audio/speech</span><input class="in mono" id="lan-url" value="${esc(e.fields.api_url)}"></label>
          <label class="f">模型<input class="in mono" id="lan-model" value="${esc(e.fields.model)}"></label>
          <label class="f">音色<span class="hint">例如 Kokoro 的 zf_xiaobei、zm_yunxi</span><input class="in mono" id="lan-voice" value="${esc(e.fields.voice)}"></label>
          <label class="f">格式<input class="in mono" id="lan-format" value="${esc(e.fields.format)}" list="lan-formats"><datalist id="lan-formats"><option value="wav"><option value="mp3"></datalist></label>
          <label class="f">API Key<span class="hint">不用就留空</span><input class="in mono" id="tts-key" type="password" autocomplete="off" placeholder="${e.key_set ? `已设置 ${esc(e.key_hint)}` : "留空"}"></label></div>
        <p class="muted small" style="margin:8px 0 0">例如 <a href="${esc(e.link)}" target="_blank" rel="noopener">Kokoro-FastAPI</a>（默认 8880 端口）、Speaches。保存之后点「试听」用保存的设置合成一句。</p>` : ""}
      ${groups.map((g) => `<div class="voice-group"><h3>${esc(g.name)}</h3><div class="voices">${g.items.map((v) => `
        <div class="voice ${v.value === chosen ? "on" : ""}" data-voice="${esc(v.value)}" role="button" tabindex="0">
          <div class="meta"><b>${esc(v.name)}</b> <span class="muted small">${esc(v.gender)}</span><small>${esc(v.style)}</small></div>
          <button class="play" data-play="${esc(v.value)}" title="试听">▶</button></div>`).join("")}</div></div>`).join("")}
      <div class="actions"><span class="result muted">保存后，设备重新连接时生效。</span>
        ${isLan && e.exists ? '<button class="btn" id="lan-play">试听</button>' : ""}
        <button class="btn primary" id="tts-save">${e.using ? (isLan ? "保存" : "保存音色") : "保存并使用"}</button></div>
    </div>`;
  const keyValue = () => (isQwen || isLan ? $("tts-key").value.trim() : "");
  if ($("lan-play")) $("lan-play").onclick = () => {
    if (audio) { audio.pause(); audio = null; }
    const a = audio = new Audio("/admin/api/tts/preview?engine=lan&t=" + Date.now());
    a.onerror = async () => { let msg = "试听失败"; try { const r = await fetch(a.src); if (!r.ok) msg = (await r.json()).error || msg; } catch (_) {} toast(msg, true); };
    a.play().catch(() => {});
  };
  page.dirty = () => chosen !== (e.voice || chosen) || !!keyValue();
  root.querySelectorAll("[data-engine]").forEach((b) => (b.onclick = async () => {
    if (b.dataset.engine === ttsView) return;
    if (page.dirty && page.dirty() && !confirm("有未保存的修改，确定切换？")) return;
    ttsView = b.dataset.engine; page.dirty = null; await openPage("tts", true);
  }));
  const pick = (el) => { chosen = el.dataset.voice; root.querySelectorAll(".voice").forEach((x) => x.classList.toggle("on", x === el)); };
  root.querySelectorAll(".voice").forEach((el) => {
    el.onclick = (ev) => { if (!ev.target.closest(".play")) pick(el); };
    el.onkeydown = (ev) => { if (ev.target === el && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); pick(el); } };
  });
  const resetPlay = () => root.querySelectorAll(".play").forEach((x) => { x.classList.remove("playing"); x.textContent = "▶"; });
  root.querySelectorAll(".play").forEach((b) => (b.onclick = async () => {
    const wasPlaying = b.classList.contains("playing");
    if (audio) { audio.pause(); audio = null; }
    resetPlay();
    if (wasPlaying) return;
    if (isQwen && !e.key_set) { toast("先填写百炼的 API Key 并保存，才能试听", true); return; }
    b.classList.add("playing"); b.textContent = "…";  // 第一次试听要先在线合成，约 1～2 秒
    const url = "/admin/api/tts/preview?voice=" + encodeURIComponent(b.dataset.play) + (isQwen ? "&engine=qwen3" : "");
    const a = audio = new Audio(url);
    a.onplaying = () => { if (audio === a) b.textContent = "■"; };
    a.onended = resetPlay;
    a.onerror = async () => {
      resetPlay();
      let msg = isQwen ? "试听失败，请检查百炼 API Key 和网络" : "试听失败，请检查电脑能否访问微软的语音服务";
      if (isQwen) { try { const r = await fetch(url); if (!r.ok) msg = (await r.json()).error || msg; } catch (_) {} }
      toast(msg, true);
    };
    a.play().catch(() => {});
  }));
  $("tts-save").onclick = (ev) => busy(ev.target, async () => {
    try {
      const body = { engine: e.id, voice: chosen };
      if (isQwen) body.api_key = keyValue();
      if (isLan) Object.assign(body, { api_key: keyValue(), api_url: $("lan-url").value.trim(), model: $("lan-model").value.trim(),
        voice: $("lan-voice").value.trim(), format: $("lan-format").value.trim() });
      const r = await api("tts", body);
      toast(r.changed && r.changed.length || !e.using ? r.note : "没有修改", r.failed);
      page.dirty = null; await openPage("tts", true);
    } catch (err) { toast(err.message, true); }
  });
  renderClones(root);
}

        else { r.action[k] = f.value; if (k === "tool") draw(); }

      const text = root.querySelector("#cmd-text").value.trim();

        const r = await api("commands/test", { text, config: cfg });
        const what = r.matched ? (r.kind === "answer" ? "网关直接答" : r.tool ? `${esc(r.tool)} ${esc(JSON.stringify(r.args))}` : r.kind === "steps" ? esc(r.note) : "只回一句话")
          : "";
        root.querySelector("#cmd-result").innerHTML = r.matched
          ? `<div class="cmd-res ok">命中「${esc(r.rule)}」→ ${what}${r.reply ? `<br>回复：${esc(r.reply)}` : ""}${r.note && r.kind !== "steps" ? `<br><span class="muted small">${esc(r.note)}</span>` : ""}</div>`

    root.querySelector("#cmd-save").onclick = (e) => busy(e.currentTarget, async () => {

      } catch (err) { toast(err.message, true); }
    });
  }
  draw();
}

          <div style="flex:1"><b>${esc(p.label)}</b>${p.needs_config ? ' <span class="pill warn">还没配置</span>' : ""}<small>${esc(p.desc)}</small>
            ${(d.devices || []).length > 1 ? `<div class="pd-chips" data-pd="${esc(p.name)}"></div>` : ""}</div>

        ${d.always_on.map((p) => `<div class="plugin fixed"><input type="checkbox" checked disabled>

    root.querySelectorAll("[data-fn]").forEach((i) => i.closest(".plugin").classList.toggle("on", i.checked));
  };
  root.querySelectorAll("[data-mode]").forEach((b) => (b.onclick = () => {

// 插件按设备（设计画布第 40 块）：插件下面列出单独开、关的设备，点开小框每台三选一，点了马上保存
const pdName = (x) => x.name || x.device_id;
function renderDeviceChips(box, d) {
  const name = box.dataset.pd;
  box.innerHTML = d.devices.filter((x) => name in x.plugins).map((x) =>
    `<button type="button" class="pd-chip ${x.plugins[name] ? "on" : "off"}">${esc(pdName(x))} ${x.plugins[name] ? "开" : "关"}</button>`).join("")
    + '<button type="button" class="pd-chip add">＋ 按设备</button>';
  box.querySelectorAll("button").forEach((b) => (b.onclick = (e) => { e.preventDefault(); e.stopPropagation(); openDevicePop(b, box, d); }));
}
function closeDevicePop() { const old = document.querySelector(".pd-pop"); if (old) { old.remove(); document.removeEventListener("pointerdown", closeDevicePop.outside, true); } }
function openDevicePop(anchor, box, d) {
  closeDevicePop();
  const name = box.dataset.pd, p = d.plugins.find((x) => x.name === name);
  const pop = document.createElement("div");
  pop.className = "pd-pop"; pop.setAttribute("role", "dialog"); pop.setAttribute("aria-label", `${p.label} 按设备`);
  const state = (x) => name in x.plugins ? (x.plugins[name] ? "on" : "off") : "inherit";
  const draw = () => {
    pop.innerHTML = `<div class="h">${esc(p.label)}<small>按设备</small></div>`
      + d.devices.map((x, i) => `<div class="pd-row"><span>${esc(pdName(x))}<small>${{ talking: "对话中", idle: "待机", offline: "离线" }[x.state] || ""}${x.version ? " · " + esc(x.version) : ""}</small></span>
        <div class="seg pd-seg" data-i="${i}">${[["inherit", "跟着全局"], ["on", "开"], ["off", "关"]].map(([v, t]) =>
          `<button type="button" data-v="${v}" class="${state(x) === v ? "on" : ""} ${v === "inherit" ? "inh" : ""}">${t}</button>`).join("")}</div></div>`).join("")
      + `<p class="muted small" style="margin:0">全局现在是「${p.enabled ? "开" : "关"}」。点了马上保存，设备下一次对话就用上${p.needs_config ? "；这个插件还没配置，先点「设置」填好，设备上才用得了" : ""}。</p>`;
    pop.querySelectorAll(".pd-seg button").forEach((b) => (b.onclick = async () => {
      const x = d.devices[+b.closest(".pd-seg").dataset.i], v = b.dataset.v;
      if (v === state(x)) return;
      try {
        const r = await api("device-settings", { device: x.device_id, plugin: { name, state: v === "inherit" ? null : v } });
        x.plugins = (r.settings && r.settings.plugins) || {};
        draw(); renderDeviceChips(box, d);
        toast(`已保存：${pdName(x)}的${p.label}${v === "inherit" ? "跟着全局" : v === "on" ? "单独开" : "单独关"}`);
      } catch (err) { toast(err.message, true); }
    }));
  };
  draw();
  document.body.appendChild(pop);
  const r = anchor.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
  pop.style.left = Math.max(12, Math.min(r.left, innerWidth - w - 12)) + "px";
  pop.style.top = (r.bottom + 6 + h > innerHeight - 12 ? Math.max(12, r.top - h - 6) : r.bottom + 6) + "px";
  closeDevicePop.outside = (e) => { if (!pop.contains(e.target)) closeDevicePop(); };
  setTimeout(() => document.addEventListener("pointerdown", closeDevicePop.outside, true));
  const esc_ = (e) => { if (e.key === "Escape") { closeDevicePop(); document.removeEventListener("keydown", esc_); } };
  document.addEventListener("keydown", esc_);
}

// 插件设置：按接口给的字段列表生成表单，显示在意图识别页插件列表下面

  box.innerHTML = `
    <div class="section-title" style="margin-top:0">${esc(label)} · 设置 ${d.configured ? '<span class="pill ok">已配置</span>' : '<span class="pill warn">还没配置</span>'}</div>
    ${d.note ? `<div class="banner info">${esc(d.note)}</div>` : ""}
    ${d.legacy_note ? `<div class="banner warn">${esc(d.legacy_note)}</div>` : ""}
    <div class="grid2">
      ${d.fields.map((f) => `<label class="f ${f.type === "text" ? "full" : ""}">${esc(f.label)}${f.hint ? `<span class="hint">${esc(f.hint)}</span>` : ""}${input(f)}</label>`).join("")}
    </div>
    <p class="muted small" style="margin:8px 0 0">${d.fields.some((f) => f.type === "secret") ? "密钥只保存在网关的配置文件里，页面上只显示首尾 4 位。" : ""}保存后马上生效，不用重启。</p>
    <div class="actions"><span class="result" id="ps-result"></span>
      <button class="btn" id="ps-close">收起</button>
      ${d.testable ? '<button class="btn" id="ps-test">测试</button>' : ""}
      <button class="btn primary" id="ps-save">保存设置</button></div>`;
  box.scrollIntoView({ behavior: "smooth", block: "nearest" });
  const values = () => Object.fromEntries([...box.querySelectorAll("[data-k]")].map((i) => [i.dataset.k, i.value.trim()]));
  const dirty = snapshot(values);
  const result = (html) => ($("ps-result").innerHTML = html);
  const bad = (msg) => result(`<span style="color:var(--err)">${esc(msg)}</span>`);
  pluginSettingsDirty = () => !box.classList.contains("hidden") && dirty();
  $("ps-close").onclick = () => { box.classList.add("hidden"); box.innerHTML = ""; };
  if ($("ps-test")) $("ps-test").onclick = (e) => busy(e.target, async () => {
    result('<span class="muted">正在真搜一次，最多等 30 秒…</span>');
    try {
      const r = await api(`plugin-settings/${encodeURIComponent(id)}/test`, values());
      result(`<span style="color:var(--ok)">✓ ${r.message ? esc(r.message) : `搜到 ${r.count} 条，用时 ${r.seconds} 秒。第一条：${esc(r.first)}`}</span>`);
    } catch (err) { bad(err.message); }
  });
  $("ps-save").onclick = (e) => busy(e.target, async () => {
    try {
      const r = await api("plugin-settings/" + encodeURIComponent(id), values());
      toast(r.note);
      // 不整页刷新，免得丢掉还没保存的插件勾选；只更新这个插件的"还没配置"标记
      document.querySelectorAll(`[data-settings="${CSS.escape(id)}"]`).forEach((b) => {
        const pill = b.closest(".plugin").querySelector(".pill.warn");
        if (r.configured && pill) pill.remove();
      });
      if (onSaved) onSaved(r.configured);
      await openPluginSettings(id, label, onSaved);
    } catch (err) { bad(err.message); }
  });
}



// ---------- [xiaozhi-hub] 设备（设计画布第 19 块）：每台设备分别配置默认模型、音色、人设、插件 ----------

let dvData = null;
async function renderDeviceSettings(root) {
  const d = dvData = await api("device-settings");
  const g = d.global;
  const ov = (text) => `<span class="dv-ov">${esc(text)}</span>`, inh = (text) => `<span class="dv-inh">跟着全局${text ? " · " + esc(text) : ""}</span>`;

  const voiceText = (x) => { if (!x.tts) return inh(g.voice); const e = d.options.tts.find((t) => t.entry === x.tts.entry);

  const personaText = (x) => x.prompt ? ov((d.options.personas.find((p) => p.text === x.prompt) || { label: "自己写的" }).label) : inh("");

      ${d.devices.map((x) => `<tr data-dev="${esc(x.device_id)}"><td>${x.name ? `<b>${esc(x.name)}</b>` : '<span class="muted">没起名字</span>'}<span class="mono sub">${esc(x.device_id)}</span></td>
        <td>${DV_STATE[x.state] || ""}</td><td>${modelText(x)}</td><td>${voiceText(x)}</td><td>${personaText(x)}</td><td>${pluginText(x)}</td>

// 就近唤醒（设计画布第 55 块，core/agent/wake_arbiter.py）：卡片放在设备列表上面
async function renderWakeArbiter(root) {
  let d;
  try { d = await api("wake-arbiter"); } catch (e) { return; }
  const card = document.createElement("div");
  card.className = "card panel wa-card";
  const head = root.querySelector(".page-head");
  if (head) head.after(card); else root.prepend(card);
  const when = (t) => new Date(t * 1000).toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
  const draw = () => {
    card.innerHTML = `<div class="wa-head"><b>就近唤醒</b><span class="muted small">几台小麦同时听到唤醒词时，只让离你最近（听到的声音最大）的那台回答</span>
      <label class="switch" style="margin:0 0 0 auto"><input type="checkbox" id="wa-on" ${d.enabled ? "checked" : ""}><b>${d.enabled ? "开" : "关"}</b></label></div>
      <div class="wa-row ${d.enabled ? "" : "off"}">等多久 ${d.windows.map((w) => `<button class="btn sm ${w === d.window ? "primary" : ""}" data-wa="${w}">${w} 秒</button>`).join("")}
        <span class="muted small">越长越不容易两台一起响，唤醒后的「叮」也晚一点</span></div>
      ${d.history.length ? `<div class="wa-hist"><span class="muted small">最近</span><span></span>${d.history.map((h) => `<span class="small">${when(h.t)}</span><span class="small">${h.claims.map((c) =>
        `<span class="${c.win ? "wa-win" : "muted"}">${esc(c.name)} ${c.score} dB${c.win ? " ✓" : ""}</span>`).join("　")}${h.claims.length === 1 ? '　<span class="muted">（只有一台听到）</span>' : ""}</span>`).join("")}</div>`
        : '<p class="muted small" style="margin:6px 0 0">还没有记录：设备升级到 0.1.681 以后，喊一声「小麦小麦」这里就会列出每台听到的音量和选了谁。</p>'}`;
    card.querySelector("#wa-on").onchange = async (e) => { try { Object.assign(d, await api("wake-arbiter", { enabled: e.target.checked })); draw(); toast(d.enabled ? "就近唤醒打开了" : "就近唤醒关了：每台听到都会回答"); } catch (err) { toast(err.message, true); } };
    card.querySelectorAll("[data-wa]").forEach((b) => (b.onclick = async () => { try { Object.assign(d, await api("wake-arbiter", { window: +b.dataset.wa })); draw(); } catch (err) { toast(err.message, true); } }));
  };
  draw();
}

// 「开 4 个 · 关 1 个」
const pdCount = (ov) => { const v = Object.values(ov || {}), on = v.filter(Boolean).length, off = v.length - on;
  return [on ? `开 ${on} 个` : "", off ? `关 ${off} 个` : ""].filter(Boolean).join(" · "); };

function openDeviceDrawer(id, root) {
