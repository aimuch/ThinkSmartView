  openDrawer(x.name || "没起名字的设备", "", (body) => {
    const tog = (key, on) => `<div class="seg" data-tog="${key}"><button type="button" data-v="inherit" class="${on ? "" : "on"}">跟着全局</button><button type="button" data-v="own" class="${on ? "on" : ""}">单独设</button></div>`;
    const ttsSel = x.tts || { entry: (d.options.tts[0] || {}).entry, voice: "" };
    const engineOf = (entry) => d.options.tts.find((t) => t.entry === entry) || d.options.tts[0];
    const voiceOptions = (e, cur) => e && e.voices.length ? e.voices.map((v) => `<option value="${esc(v.value)}" ${v.value === cur ? "selected" : ""}>${esc(v.name)}${v.group ? " · " + esc(v.group) : ""}</option>`).join("") : "";
    const pl = { ...(x.plugins || {}) };
    body.innerHTML = `
      <div class="dkv"><span>设备 ID</span><b class="mono" style="font-weight:400">${esc(x.device_id)}</b>
        <span>状态</span><b style="font-weight:400">${{ talking: "对话中", idle: "待机", offline: "离线" }[x.state]}${x.version ? " · 客户端 " + esc(x.version) : ""}</b></div>
      <div class="dv-sec"><div class="t">名字</div><div class="body"><input class="in" id="dv-name" maxlength="16" value="${esc(x.name)}" placeholder="比如 客厅小麦、儿童房"></div></div>
      <div class="dv-sec"><div class="t">默认模型 ${tog("model", !!x.model)}</div>
        <div class="body ${x.model ? "" : "hidden"}" data-body="model"><select class="in" id="dv-model">${d.options.models.map((m) => `<option value="${esc(m.entry)}" ${m.entry === x.model ? "selected" : ""}>${esc(m.label)}</option>`).join("")}</select>
          <p class="muted small" style="margin:6px 0 0">保存时这台设备立刻换过去；之后说「嗨 + 称呼」换走了照常记住。</p></div>
        <p class="muted small ${x.model ? "hidden" : ""}" data-inh="model" style="margin:6px 0 0">全局：${esc(d.global.model)}${x.remembered ? `；这台现在用 ${esc(x.remembered_label)}（叫名字换的）` : ""}</p></div>
      <div class="dv-sec"><div class="t">音色 ${tog("tts", !!x.tts)}</div>
        <div class="body ${x.tts ? "" : "hidden"}" data-body="tts">
          <div class="grid2" style="gap:8px"><select class="in" id="dv-engine">${d.options.tts.map((t) => `<option value="${esc(t.entry)}" ${t.entry === ttsSel.entry ? "selected" : ""}>${esc(t.label)}</option>`).join("")}</select>
          <span id="dv-voice-box"></span></div></div>
        <p class="muted small ${x.tts ? "hidden" : ""}" data-inh="tts" style="margin:6px 0 0">全局：${esc(d.global.tts_label)} · ${esc(d.global.voice)}</p></div>
      <div class="dv-sec"><div class="t">人设 ${tog("prompt", !!x.prompt)}</div>
        <div class="body ${x.prompt ? "" : "hidden"}" data-body="prompt"><div class="chips">${d.options.personas.map((p, i) => `<span class="chip" data-persona="${i}">${esc(p.label)}</span>`).join("")}</div>
          <textarea class="in" id="dv-prompt" maxlength="2000" placeholder="写这台设备的人设，比如：你叫小麦，是一个耐心的小老师……">${esc(x.prompt || "")}</textarea></div>
        <p class="muted small ${x.prompt ? "hidden" : ""}" data-inh="prompt" style="margin:6px 0 0">全局人设：${esc(d.global.prompt.slice(0, 60))}${d.global.prompt.length > 60 ? "…" : ""}</p></div>
      <div class="dv-sec"><div class="t">插件<span class="muted small" id="dv-pl-sum" style="font-weight:400;margin-left:auto"></span></div>
        <div class="body pd-list" id="dv-plugins"></div>
        <div style="display:flex;justify-content:flex-end;margin-top:4px"><button type="button" class="btn sm" id="dv-pl-reset">全部跟着全局</button></div></div>
      <div class="dv-sec"><div class="t">这台设备的数据</div><div class="body dkv">
        <span>住宅地址</span><b style="font-weight:400">${esc(x.data.home || "没设")}</b><span>儿童模式</span><b style="font-weight:400">${esc(x.data.kids)}</b>

    const voiceBox = () => {
      const e = engineOf($("dv-engine").value), cur = $("dv-engine").value === ttsSel.entry ? ttsSel.voice : "";
      $("dv-voice-box").innerHTML = e && e.voices.length ? `<select class="in" id="dv-voice">${voiceOptions(e, cur)}</select>`
        : `<input class="in mono" id="dv-voice" value="${esc(cur)}" placeholder="音色名">`;
    };
    if (d.options.tts.length) { voiceBox(); $("dv-engine").onchange = voiceBox; }
    body.querySelectorAll("[data-tog]").forEach((sg) => sg.querySelectorAll("button").forEach((b) => (b.onclick = () => {
      sg.querySelectorAll("button").forEach((y) => y.classList.toggle("on", y === b));
      const own = b.dataset.v === "own", k = sg.dataset.tog;
      body.querySelector(`[data-body="${k}"]`).classList.toggle("hidden", !own);
      body.querySelector(`[data-inh="${k}"]`).classList.toggle("hidden", own);
    })));
    body.querySelectorAll("[data-persona]").forEach((c) => (c.onclick = () => { $("dv-prompt").value = d.options.personas[+c.dataset.persona].text; }));
    const drawPlugins = () => {
      $("dv-plugins").innerHTML = d.options.plugins.map((p) => {
        const g = d.global.plugins.includes(p.name), st = p.name in pl ? (pl[p.name] ? "on" : "off") : "inherit";
        return `<div class="pd-row ${st === "inherit" ? "" : "ch"}"><span><b>${esc(p.label)}</b><small>全局${g ? "开" : "关"}${p.needs_config ? " · 还没配置" : ""}</small></span>
          <div class="seg pd-seg" data-pl="${esc(p.name)}">${[["inherit", "跟着全局"], ["on", "开"], ["off", "关"]].map(([v, t]) =>
            `<button type="button" data-v="${v}" class="${st === v ? "on" : ""} ${v === "inherit" ? "inh" : ""}">${t}</button>`).join("")}</div></div>`;
      }).join("");
      $("dv-pl-sum").textContent = `全局开着 ${d.global.plugins.length} 个` + (Object.keys(pl).length ? ` · 这台${pdCount(pl)}` : "");
      $("dv-plugins").querySelectorAll(".pd-seg button").forEach((b) => (b.onclick = () => {
        const n = b.closest(".pd-seg").dataset.pl;
        if (b.dataset.v === "inherit") delete pl[n]; else pl[n] = b.dataset.v === "on";
        drawPlugins();
      }));
    };
    drawPlugins();
    $("dv-pl-reset").onclick = () => { Object.keys(pl).forEach((k) => delete pl[k]); drawPlugins(); };
    const own = (k) => body.querySelector(`[data-tog="${k}"] .on`).dataset.v === "own";
    $("dv-save").onclick = (e) => busy(e.target, async () => {
      const payload = { device: x.device_id, name: $("dv-name").value,
        model: own("model") ? $("dv-model").value : null,
        tts: own("tts") && $("dv-voice") ? { entry: $("dv-engine").value, voice: $("dv-voice").value.trim() } : null,
        prompt: own("prompt") ? $("dv-prompt").value : null,
        plugins: { ...pl } };
      try { const r = await api("device-settings", payload); toast(r.note); closeDrawer(); await renderDeviceSettings(root); }
      catch (err) { $("dv-result").innerHTML = `<span style="color:var(--err)">${esc(err.message)}</span>`; }
    });
    $("dv-forget").onclick = () => askDeleteDevice(x, async () => { closeDrawer(); await renderDeviceSettings(root); });
  });
}

// 删除设备确认框（设计画布第 37 块）：逐项列出删什么；在线的要输管理员密码（后端也校验）
function askDeleteDevice(x, done) {
  const online = x.state !== "offline", dt = x.data || {};
  const name = x.name ? `「${x.name}」` : "「没起名字」的设备";
  const trash = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>';
  const wrap = document.createElement("div");
  wrap.className = "ddlg-wrap";
  wrap.innerHTML = `<div class="ddlg" role="dialog" aria-modal="true" aria-label="删除设备">
    <div class="hd"><span class="ic">${trash}</span><b>删除${esc(name)}？</b></div>
    <div class="did">${esc(x.device_id)} · ${{ talking: "对话中", idle: "待机", offline: "离线" }[x.state] || ""}${x.version ? " · 客户端 " + esc(x.version) : ""}</div>
    <div class="list">
      <div class="row"><input type="checkbox" checked disabled><div><div>名字、单独设置、记住的模型</div><div class="s">一定会删</div></div></div>
      <label class="row"><input type="checkbox" id="dd-chat" checked><div><div>聊天记录和记忆</div><div class="s">${dt.messages || 0} 条记录 · 记忆 ${dt.memory_chars || 0} 字 · 拍照问答的照片</div></div></label>
      <label class="row"><input type="checkbox" id="dd-data" ${online ? "" : "checked"}><div><div>这台设备的其它数据</div><div class="s">住宅地址 ${esc(dt.home || "没设")} · 儿童模式 ${esc(dt.kids || "关")} · 家人声音 ${dt.voices || 0} 人 · 清单 ${dt.lists || 0} 项</div></div></label>
    </div>
    <div class="keep" id="dd-keep"></div>
    ${online ? `<div class="warn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex:none;margin-top:2px"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h.01"/></svg><span>这台设备正连着网关。删除后它下一次对话起没有名字，所有设置都跟着全局。</span></div>
      <div class="pw"><label for="dd-pw">输入管理员密码确认</label><input class="in" id="dd-pw" type="password" autocomplete="current-password"><div class="em" id="dd-err"></div></div>`
      : '<div class="em" id="dd-err"></div>'}
    <div class="ft"><button class="btn" id="dd-no">取消</button><button class="btn go" id="dd-go">删除</button></div></div>`;
  document.body.appendChild(wrap);
  const q = (id) => wrap.querySelector("#" + id), close = () => { wrap.remove(); document.removeEventListener("keydown", onKey, true); };
  const onKey = (e) => { if (e.key === "Escape") { e.stopPropagation(); close(); } };
  document.addEventListener("keydown", onKey, true);
  const sync = () => {
    q("dd-keep").textContent = (q("dd-chat").checked ? "" : "不删聊天记录的话，它还会留在设备列表里。") + "费用统计保留。设备以后再连上，会作为新设备出现。";
    if (online) q("dd-go").disabled = !q("dd-pw").value;
  };
  q("dd-chat").onchange = sync; if (online) { q("dd-pw").oninput = () => { q("dd-pw").classList.remove("bad"); q("dd-err").textContent = ""; sync(); }; }
  sync();
  wrap.onclick = (e) => { if (e.target === wrap) close(); };
  q("dd-no").onclick = close;
  q("dd-go").onclick = (e) => busy(e.target, async () => {
    try {
      const r = await api("device-settings/forget", { device: x.device_id, chat: q("dd-chat").checked, data: q("dd-data").checked,
                                                       ...(online ? { password: q("dd-pw").value } : {}) });
      close(); toast(r.deleted ? `已删除设备和 ${r.deleted} 条聊天记录` : "已删除设备"); await done();
    } catch (err) {
      q("dd-err").textContent = err.message;
      if (online) { q("dd-pw").classList.add("bad"); q("dd-pw").select(); }
    }
  });
  if (online) q("dd-pw").onkeydown = (e) => { if (e.key === "Enter" && q("dd-pw").value) q("dd-go").click(); };
  (online ? q("dd-pw") : q("dd-go")).focus();
}

// ---------- [xiaozhi-hub] 智能体（设计画布第 18 块）：叫名字派活，做完回来汇报 ----------

  const MARK = { dsh: ["D", "#1f3a8a", "#cfe0ff"], claude: ["C", "#fef3c7", "#b45309"] };

        <div><b>${esc(a.name)}${isDefault(a.entry)}</b><small>${esc(a.sub)} · ${esc(aliases(a.aliases))}</small></div>${pill(a.state)}</div>
        <div class="ag-tags">${a.id === "dsh" ? '<span class="b">读写工作目录</span><span>联网搜索</span><span>用 DeepSeek 的 Key</span>' : '<span class="b">读写工作目录</span><span>要 Claude 账号</span>'}${a.version ? `<span>${esc(a.version)}</span>` : ""}</div></button>`).join("")}
      <div class="ag-card off"><div class="ag-top">${logoTile(d.logos.codex, "X", "md")}<div><b>Codex CLI</b><small>即将支持</small></div></div></div>
    </div>
    <div class="ag-grp">云端同事</div>
    <div class="ag-cards">
      <button class="ag-card" id="ag-grok"><div class="ag-top">${logoTile(d.logos.grok, "G", "md")}
        <div><b>Grok Bot</b><small>xAI · ${grok.bots.length ? `${grok.bots.length} 个 Bot：${esc(grok.bots.slice(0, 2).map((b) => b.bot_name).join("、"))}` : "叫 Bot 的名字派活"}</small></div>
        ${pill(grok.logged_in ? (grok.bots.length ? "ready" : "setup") : "setup").replace("没设置", grok.logged_in ? "没勾选 Bot" : "没登录")}</div>
        <div class="ag-tags"><span class="b">云端电脑</span><span>网关关机也在做</span><span>有浏览器</span></div></button>
    </div>
    <div class="ag-grp">自己加的<span>OpenAI 兼容接口（Hermes Agent 等）、Dify、Coze</span></div>
    <div class="ag-cards">
      ${d.custom.map((a) => { const k = d.kinds.find((x) => x.id === a.kind); return `<button class="ag-card ${agentEdit === a.entry ? "on" : ""}" data-agent-edit="${esc(a.entry)}">
        <div class="ag-top">${logoTile(a.logo, a.name, "md")}
        <div><b>${esc(a.name)}${isDefault(a.entry)}</b><small>${esc(k ? k.label : a.kind)} · ${esc(aliases(a.aliases))}</small></div>${pill(a.ready ? "ready" : "setup")}</div>
        <div class="ag-tags">${a.kind === "dify" ? `<span class="b">${a.mode === "workflows/run" ? "流水线（工作流）" : "Dify 应用"}</span>` : a.kind === "coze" ? '<span class="b">Coze</span>' : `<span class="b">${a.background ? "慢了转后台" : "一直等着"}</span>`}
          ${a.base_url ? `<span class="mono">${esc(a.base_url.replace(/^https?:\/\//, "").slice(0, 28))}</span>` : ""}</div></button>`; }).join("")}
      <button class="ag-add" data-agent-edit="new">＋ 加一个智能体</button>
    </div>
    <div class="card panel ag-form ${agentEdit ? "" : "hidden"}" id="ag-form"></div>
    <div class="section-title">智能体和流水线</div>
    <div class="card panel small muted" style="line-height:1.8">
      <b style="color:var(--text)">智能体</b>（DSH、Hermes、Grok Bot、Claude Code）：给它目标，它自己决定用哪些工具、做几步。<b style="color:var(--text)">流水线</b>（Dify 工作流）：步骤是你在 Dify 里事先连好的。两种都是「叫名字派活、等结果」，所以放在一起；称呼在<a href="#calls">称呼</a>页也能改。
    </div>`;
  root.querySelectorAll("[data-go-llm]").forEach((b) => (b.onclick = () => { agentView = b.dataset.goLlm; openPage("llm"); }));
  $("ag-grok").onclick = () => openPage("grokbot");

function renderAgentForm(box, d, root) {
  const isNew = agentEdit.startsWith("new:");
  const a = isNew ? { kind: agentEdit.slice(4), name: "", base_url: "", model: "", mode: "chat-messages", bot_id: "", background: true, aliases: [], key_set: false }
    : d.custom.find((x) => x.entry === agentEdit);
  if (!a) { agentEdit = null; box.classList.add("hidden"); return; }
  const kind = d.kinds.find((k) => k.id === a.kind);
  const seg = (items, cur, attr) => `<div class="seg">${items.map((x) => `<button type="button" data-${attr}="${esc(x.value)}" class="${x.value === cur ? "on" : ""}">${esc(x.label)}</button>`).join("")}</div>`;
  box.innerHTML = `
    <h2 style="margin:0 0 4px;font-size:15px">${isNew ? "加一个智能体" : esc(a.name)}</h2>
    ${isNew ? `<div class="cli-row"><div class="cli-k">类型</div><div>${seg(d.kinds.map((k) => ({ value: k.id, label: k.label })), a.kind, "kind")}
      <div class="small muted" style="margin-top:6px">${esc(kind.hint)}</div></div></div>` : ""}
    <div class="grid2" style="margin-top:8px">
      <label class="f">名字<span class="hint">播报和设备上显示</span><input class="in" id="ag-name" maxlength="20" value="${esc(a.name)}" placeholder="${a.kind === "openai" ? "Hermes" : a.kind === "dify" ? "菜谱助手" : "我的扣子"}"></label>
      <label class="f">称呼<span class="hint">逗号分隔，说「嗨 + 称呼」叫它；留空用名字</span><input class="in" id="ag-aliases" value="${esc((a.aliases || []).join("，"))}" placeholder="${a.kind === "openai" ? "hermes，赫尔墨斯" : a.kind === "dify" ? "菜谱助手" : "扣子"}"></label>
      ${a.kind !== "coze" ? `<label class="f full">接口地址<span class="hint">${a.kind === "openai" ? "Hermes：在它的 ~/.hermes/.env 里开 API_SERVER_ENABLED=true，默认 http://127.0.0.1:8642/v1；在别的电脑上要把 API_SERVER_HOST 设成 0.0.0.0" : "自己部署的 Dify 填它的 /v1 地址"}</span>
        <input class="in mono" id="ag-url" value="${esc(a.base_url || kind.base_url)}"></label>` : ""}
      ${a.kind === "openai" ? `<label class="f">模型<span class="hint">Hermes 不看这个，留空就行</span><input class="in mono" id="ag-model" value="${esc(a.model)}"></label>` : ""}
      ${a.kind === "coze" ? `<label class="f">bot_id<span class="hint">智能体网址里 /bot/ 后面那串数字</span><input class="in mono" id="ag-bot" value="${esc(a.bot_id)}"></label>` : ""}
      <label class="f ${a.kind === "openai" ? "" : "full"}">${a.kind === "coze" ? "个人令牌" : a.kind === "dify" ? "应用的 API Key" : "API Key"}<span class="hint">${a.kind === "openai" ? "Hermes 填 API_SERVER_KEY；不用就留空" : ""}</span>
        <input class="in mono" id="ag-key" type="password" autocomplete="off" placeholder="${a.key_set ? `已设置 ${esc(a.key_hint || "")}，输入新值可替换` : a.kind === "openai" ? "不用就留空" : "未设置"}"></label>
    </div>
    ${a.kind === "dify" ? `<div class="cli-row" style="margin-top:8px"><div class="cli-k">Dify 类型</div><div>${seg(d.dify_modes, a.mode, "mode")}
      <div class="small muted" style="margin-top:6px">工作流的输入变量要叫 query，输出变量要叫 answer。</div></div></div>` : ""}
    ${a.kind === "openai" ? `<div class="cli-row" style="margin-top:8px"><div class="cli-k">慢了怎么办</div><div>${seg([{ value: "bg", label: "转后台，做完汇报" }, { value: "wait", label: "一直等着" }], a.background ? "bg" : "wait", "bg")}</div></div>` : ""}
    <div class="actions"><span class="result muted" id="ag-result">${a.kind === "openai" ? "智能体自己有工具和记忆；小麦只把这台设备的对话发过去，念它的回答。" : ""}</span>
      ${isNew ? "" : '<button class="btn danger" id="ag-del">删除</button><button class="btn" id="ag-test">测试</button>'}
      <button class="btn" id="ag-cancel">取消</button><button class="btn primary" id="ag-save">保存</button></div>`;
  const segVal = (attr) => (box.querySelector(`[data-${attr}].on`) || {}).dataset?.[attr];
  box.querySelectorAll(".seg button").forEach((b) => (b.onclick = () => {
    if (b.dataset.kind) { agentEdit = "new:" + b.dataset.kind; return renderAgentForm(box, d, root); }
    b.parentElement.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
  }));
  const out = (html) => ($("ag-result").innerHTML = html);
  $("ag-cancel").onclick = () => { agentEdit = null; renderAgents(root); };
  $("ag-save").onclick = (e) => busy(e.target, async () => {
    const raw = $("ag-aliases").value.trim();
    const body = { kind: a.kind, entry: isNew ? "" : a.entry, name: $("ag-name").value, api_key: $("ag-key").value.trim(),
      aliases: raw ? raw.split(/[,，、\s]+/).filter(Boolean) : null };
    if ($("ag-url")) body.base_url = $("ag-url").value.trim();
    if ($("ag-model")) body.model = $("ag-model").value.trim();
    if ($("ag-bot")) body.bot_id = $("ag-bot").value.trim();
    if (a.kind === "dify") body.mode = segVal("mode");
    if (a.kind === "openai") body.background = segVal("bg") !== "wait";
    try { const r = await api("agents", body); agentEdit = r.entry; toast("已保存，说「嗨 + 称呼」就能叫它"); await renderAgents(root); }
    catch (err) { out(`<span style="color:var(--err)">${esc(err.message)}</span>`); }
  });
  if ($("ag-test")) $("ag-test").onclick = (e) => busy(e.target, async () => {
    out('<span class="muted">正在问它「你好」…（智能体可能要想一会儿，最多等 60 秒）</span>');
    try { const r = await api("agents/test", { entry: a.entry });
      out(r.ok ? `<span style="color:var(--ok)">✓ ${r.seconds} 秒：${esc(r.reply)}</span>` : `<span style="color:var(--err)">✗ ${esc(r.error)}</span>`); }
    catch (err) { out(`<span style="color:var(--err)">${esc(err.message)}</span>`); }
  });
  if ($("ag-del")) $("ag-del").onclick = (e) => busy(e.target, async () => {
    if (!confirm(`删掉「${a.name}」？它的称呼也一起删掉。`)) return;
    try { await api("agents/delete", { entry: a.entry }); agentEdit = null; toast("已删除"); await renderAgents(root); }
    catch (err) { out(`<span style="color:var(--err)">${esc(err.message)}</span>`); }
  });
}

async function renderGrokBot(root) {
  const d = await api("grokbot");
  const acc = d.account, login = d.login, entries = d.entries, bots = d.bots;
  const fmt = (t) => (t ? new Date(t * 1000).toLocaleString() : "");
  const days = acc.expires_at ? Math.floor((acc.expires_at * 1000 - Date.now()) / 86400000) : 0;
  const stillHere = () => page.name === "grokbot";  // 读取 Bot 列表可能要等几分钟，用户离开了就别把页面拉回来
  const checked = new Set(entries.map((e) => e.bot_id));
  const aliasesOf = (id) => ((entries.find((e) => e.bot_id === id) || {}).aliases || []);
  // 还没从云端读过列表时，先列出已勾选的
  const list = bots || entries.map((e) => ({ id: e.bot_id, name: e.bot_name, preview: "", busy: false }));
  root.innerHTML = `
    <p class="small" style="margin:0 0 6px"><a href="#agents">‹ 智能体</a></p>
    <div class="page-head"><div><h1>Grok Bot</h1><p class="sub">xAI 的云端 AI 同事。用 Cursor 账号登录后勾选 Bot，它的名字会自动成为称呼，对设备说“嗨 孙悟空，帮我……”就能派活，它的回复会念出来；长任务做完后在 Grok Bot App 里也能看到。</p></div>
      <span class="pill ${acc.logged_in ? "ok" : "warn"}">${acc.logged_in ? "已登录" : acc.needs_login ? "登录已失效" : "未登录"}</span></div>
    <div class="banner warn">走的是 Grok Bot 桌面 App 用的内部接口，不是官方公开的 API：App 升级后可能失效，使用频率请和手动聊天相当。凭证只保存在本机，不会显示在页面上。</div>
    <div class="section-title">账号</div>
    <div class="card panel">
      ${login.pending ? `<div class="banner info">正在等待你在浏览器里批准登录。页面没有自动打开的话，复制下面的地址在浏览器里打开，登录 Cursor 账号后点“批准”（不是“打开 Grok Bot”）。</div>
        <div class="kv"><div class="k">登录地址</div><code style="word-break:break-all">${esc(login.url)}</code><button class="btn sm copy" data-copy="${esc(login.url)}">复制</button></div>
        <div class="actions"><a class="btn" href="${esc(login.url)}" target="_blank" rel="noopener">打开登录页</a><button class="btn" id="gb-cancel">取消</button></div>`
      : `${login.result && !login.result.ok ? `<div class="banner err">${esc(login.result.note)}</div>` : ""}
        ${acc.logged_in ? `<p style="margin:0 0 12px">${days >= 0 ? `已登录，登录有效期还有 ${days} 天（到 ${esc(fmt(acc.expires_at))}）。快到期时会自动续期` : "已登录，下次使用时会自动续期"}；续期失败这里会提示重新登录。</p>`
          : acc.needs_login ? '<p style="margin:0 0 12px">登录已失效（服务端要求重新登录），请重新登录。</p>'
          : '<p style="margin:0 0 12px">还没登录。点“登录”会给出一个 Cursor 的登录地址，在浏览器里批准即可，不需要在这里输入密码。</p>'}
        <div class="actions" style="justify-content:flex-start"><button class="btn primary" id="gb-login">${acc.logged_in ? "重新登录" : "登录"}</button>
          ${acc.logged_in || acc.needs_login ? '<button class="btn" id="gb-logout">退出登录</button>' : ""}</div>`}
    </div>
    <div class="section-title">Bot</div>
    <div class="card panel">
      ${!acc.logged_in ? '<p class="muted" style="margin:0">登录后再读取 Bot 列表。</p>' : `
      ${d.bots_error ? `<div class="banner err">读取 Bot 列表失败：${esc(d.bots_error)}</div>` : ""}
      <p class="muted small" style="margin:0 0 4px">${bots ? `列表读取于 ${esc(fmt(d.bots_at))}。` : "还没从云端读取 Bot 列表（会唤醒休眠的云端电脑，要几秒）。"}勾选保存后自动用 Bot 的名字做称呼；想改写法、或按你的发音录入，到<a href="#calls">称呼</a>页。名字含空格标点、或已被别的模型占用时不会自动配，要到称呼页手动加。</p>
      ${list.length ? list.map((b) => `<label class="switch" style="margin-top:8px"><input type="checkbox" data-bot="${esc(b.id)}" data-name="${esc(b.name)}" ${checked.has(b.id) ? "checked" : ""}>
          <span>${esc(b.name)}${b.busy ? ' <span class="pill">忙</span>' : ""}${checked.has(b.id) ? (aliasesOf(b.id).length ? ` <span class="pill ok">称呼：${esc(aliasesOf(b.id).join("、"))}</span>` : ' <span class="pill warn">还没配称呼</span>') : ""}</span>
          <small>${esc(b.preview || "")}</small></label>`).join("") : '<p class="muted" style="margin:8px 0 0">没有 Bot。先在 Grok Bot App 里创建，再点“重新读取”。</p>'}
      <div class="actions"><span class="result muted">保存后马上生效，不用重启服务。</span>
        <button class="btn" id="gb-refresh">${bots ? "重新读取" : "读取 Bot 列表"}</button><button class="btn primary" id="gb-save">保存</button></div>`}
    </div>`;
  root.querySelectorAll("[data-copy]").forEach((b) => (b.onclick = () => copyText(b.dataset.copy)));
  if ($("gb-login")) $("gb-login").onclick = (e) => busy(e.target, async () => {
    try { const r = await api("grokbot/login", {}); window.open(r.url, "_blank", "noopener"); if (stillHere()) await openPage("grokbot", true); }
    catch (err) { toast(err.message, true); }
  });
  if ($("gb-cancel")) $("gb-cancel").onclick = async () => { await api("grokbot/login/cancel", {}); await openPage("grokbot", true); };
  if ($("gb-logout")) $("gb-logout").onclick = async () => {
    if (!confirm("退出登录会删除本机保存的凭证，之后设备叫不到 Grok Bot（正在进行的对话会做完）。确定吗？")) return;
    await api("grokbot/logout", {}); await openPage("grokbot", true);
  };
  if ($("gb-refresh")) $("gb-refresh").onclick = (e) => busy(e.target, async () => {
    try { await api("grokbot/bots/refresh", {}); if (stillHere()) await openPage("grokbot", true); } catch (err) { toast(err.message, true); }
  });
  if ($("gb-save")) $("gb-save").onclick = (e) => busy(e.target, async () => {
    const picked = [...root.querySelectorAll("[data-bot]:checked")].map((c) => ({ id: c.dataset.bot, name: c.dataset.name }));
    try { const r = await api("grokbot/bots", { bots: picked }); toast(r.changed.length ? r.note : "没有修改"); await openPage("grokbot", true); }
    catch (err) { toast(err.message, true); }
  });
  if (login.pending) {
    // 等批准期间每 3 秒看一次，登录成功后自动刷新本页
    page.timer = setInterval(async () => {
      if (document.hidden) return;
      try { const s = await api("grokbot", undefined, true); if (!s.login.pending) { clearInterval(page.timer); page.timer = null; await openPage("grokbot", true); } }
      catch (e) { onDevicesError(e); }
    }, 3000);
  }
}

// ---------- 记忆：聊天记录里被截掉的旧对话总结成的"关于用户"的要点，每台设备一份，所有 API 模型共用 ----------
async function renderMemory(root) {
  const d = await api("memory");
  const st = d.settings;
  const SOURCE = { summary: "自动总结", manual: "后台修改", cleared: "已清空" };
  const fmt = (t) => (t ? new Date(t * 1000).toLocaleString("zh-CN", { hour12: false }) : "");
  const edits = {};  // device -> 编辑框里的内容（改过才有）
  page.dirty = () => d.devices.some((x) => edits[x.device] !== undefined && edits[x.device] !== x.memory.summary);
  const status = !st.enabled ? '<span class="pill">聊天记录未开启</span>'
    : st.summary ? '<span class="pill ok">自动总结已开启</span>' : '<span class="pill">自动总结已关闭</span>';
  root.innerHTML = `
    <div class="page-head"><div><h1>记忆</h1><p class="sub">聊天记录按设备和模型存在本机（data/chat.db），每次只把最近 ${st.max_messages} 条（约 ${st.max_tokens} token 以内）发给模型；
      更早的部分自动总结成这里的记忆，放进系统提示。同一台设备的所有 API 模型共用一份记忆，Claude Code 和 Grok Bot 不用它（它们的上下文在自己的会话里）。
      在这里修改或清空后，下一次提问就按新的来。</p></div>${status}</div>
    <div id="mem-list"></div>`;
  const list = $("mem-list");
  const draw = () => {
    if (!d.devices.length) { list.innerHTML = '<div class="card panel muted">还没有聊天记录。设备聊过几轮、旧对话被截掉后，这里会出现总结出来的记忆。</div>'; return; }
    list.innerHTML = d.devices.map((x) => {
      const m = x.memory, value = edits[x.device] ?? m.summary;
      const models = x.models.map((o) => `${esc(o.label)} ${o.count} 条${o.agent ? "（不总结）" : ""}`).join("、") || "没有聊天记录";
      return `<div class="card panel" data-device="${esc(x.device)}">
        <div class="device-top"><span class="dot ${x.online ? "on" : ""}"></span><b class="mono">${esc(x.device)}</b>
          ${m.updated ? `<span class="pill">${esc(SOURCE[m.source] || "")} · ${esc(fmt(m.updated))}</span>` : '<span class="pill">还没有记忆</span>'}
          <button class="btn sm" data-history style="margin-left:auto">最近对话 ›</button></div>
        <p class="muted small" style="margin:8px 0 0">存着的记录：${models}</p>
        <label class="f" style="margin-top:14px">记忆全文<span class="hint">要点式，每条一行；自动总结时会在这份基础上合并新的内容（约 ${st.summary_chars} 字以内）</span>
          <textarea class="in" rows="8" data-edit maxlength="5000" placeholder="（空）">${esc(value)}</textarea></label>
        <div class="actions"><span class="result muted small">${value.length} 字</span>
          <button class="btn" data-clear ${m.summary || value ? "" : "disabled"}>清空</button>
          <button class="btn primary" data-save>保存</button></div></div>`;
    }).join("");
    list.querySelectorAll("[data-device]").forEach((card) => {
      const dev = card.dataset.device, x = d.devices.find((y) => y.device === dev);
      const ta = card.querySelector("[data-edit]");
      ta.oninput = () => { edits[dev] = ta.value; card.querySelector(".result").textContent = `${ta.value.length} 字`; };
      const save = (btn, text) => busy(btn, async () => {
        const res = await fetch("/admin/api/memory/save", { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ device: dev, summary: text, version: x.memory.version }) });
        const r = await res.json().catch(() => ({}));
        if (res.status === 401) return toast(EXPIRED + "。请先复制改好的内容，再刷新页面重新登录", true);
        if (res.status === 409) { x.memory = r.memory; toast(r.error, true); draw(); return; }
        if (!res.ok || r.ok === false) return toast(r.error || "保存失败", true);
        x.memory = r.memory; delete edits[dev];
        toast(text ? "已保存，下一次提问就用新的记忆" : "记忆已清空"); draw();
      });
      card.querySelector("[data-history]").onclick = () => openDrawer(`最近对话 · ${dev}`, '<p class="muted">加载中…</p>', async (body) => {
        try {
          const h = await api("memory/history?device=" + encodeURIComponent(dev));
          const ROLE = { user: "问", bot: "答" };
          body.innerHTML = Object.entries(h.models).map(([entry, msgs]) => `<div><b>${esc(entry)}</b>${msgs.slice().reverse().map((m) =>
            `<div style="border-top:1px solid var(--line);padding:8px 0;font-size:13px"><span class="pill ${m.role === "user" ? "" : "ok"}">${ROLE[m.role] || esc(m.role)}</span>
              <span class="muted small">${esc(fmt(m.time))}</span><div style="margin-top:4px;white-space:pre-wrap">${esc(m.text)}</div></div>`).join("")}</div>`).join("")
            || '<p class="muted">还没有对话。</p>';
        } catch (err) { body.innerHTML = `<div class="banner err">${esc(err.message)}</div>`; }
      });
      card.querySelector("[data-save]").onclick = (e) => save(e.currentTarget, ta.value);
      card.querySelector("[data-clear]").onclick = (e) => { if (confirm(`清空 ${dev} 的记忆？聊天记录不受影响。`)) save(e.currentTarget, ""); };
    });
  };
  draw();
}

async function renderCostPrices(root) {

  // 固定 30 格（没用的日子留空），一天的数据不会占满整行
  const byDay = Object.fromEntries((d.days || []).filter((r) => r.currency === (q.currency || "CNY")).map((r) => [r.key, r]));

    return byDay[key] || { key, cost: 0, requests: 0, currency: q.currency || "CNY" };
  });
  const maxDay = Math.max(0.000001, ...days.map((r) => r.cost));
  const table = (rows, label) => rows.length ? `<table class="cost-table"><tr><th>${label}</th><th class="n">请求</th><th class="n">输入</th><th class="n">缓存命中</th><th class="n">输出</th><th class="n">费用</th></tr>${
    rows.map((r) => `<tr><td>${esc(r.key || "—")}${r.unpriced ? ' <span class="pill warn">没有单价</span>' : ""}${r.estimated ? ' <span class="pill">含估算</span>' : ""}</td>
      <td class="n">${r.requests}</td><td class="n">${num(r.prompt)}</td><td class="n">${num(r.cache_hit)}</td><td class="n">${num(r.completion)}</td>
      <td class="n">${sym(r.currency)}${r.cost.toFixed(4)}</td></tr>`).join("")}</table>` : '<p class="muted small">本月还没有记录</p>';
  const PURPOSE = { chat: "对话", summary: "记忆总结", intent: "意图识别", search: "联网搜索", vision: "看图", study: "学习陪伴" };

  root.innerHTML = `
    ${costHead()}
    ${d.unpriced.length ? `<div class="banner warn">这些模型还没有单价，费用按 0 算：${d.unpriced.map(esc).join("、")}。在下面「单价」里加上。</div>` : ""}
    ${d.prices_default ? '<div class="banner info">单价现在用的是内置的参考价（DeepSeek，2026-11-08 按官网核对）。厂商会调价，请核对后保存；其他厂商的价格要自己填。</div>' : ""}
    <div class="cost-stats">
      ${stat("今天 " + esc(d.this_day), d.today, d.tokens.today, q.used_today, q.daily)}
      ${stat("本月 " + esc(d.this_month), d.month, d.tokens.month, q.used_month, q.monthly)}
      ${stat("累计", d.total, d.tokens.total, 0, 0)}
    </div>
    <div class="card panel"><b>额度</b><p class="muted small" style="margin:4px 0 10px">填 0 表示不限。超额后：拒绝（设备念一句「额度用完了」，不请求模型），或者改用下面选的便宜模型接着答（只对这台设备这一次连接，不改后台默认）。</p>
      <div class="price-row" style="grid-template-columns: 90px repeat(3, 1fr) 1fr 1.4fr">
        <label>币种<select class="in" data-q="currency">${Object.keys(d.currencies).map((c) => `<option ${quota.currency === c ? "selected" : ""}>${c}</option>`).join("")}</select></label>
        <label>每天<input class="in" data-q="daily" type="number" min="0" step="0.01" value="${quota.daily}"></label>
        <label>每月<input class="in" data-q="monthly" type="number" min="0" step="0.01" value="${quota.monthly}"></label>
        <label>每台设备每天<input class="in" data-q="device_daily" type="number" min="0" step="0.01" value="${quota.device_daily}"></label>
        <label>超额后<select class="in" data-q="action"><option value="block" ${quota.action === "block" ? "selected" : ""}>拒绝</option><option value="downgrade" ${quota.action === "downgrade" ? "selected" : ""}>改用便宜模型</option></select></label>
        <label>便宜模型<select class="in" data-q="downgrade_to"><option value="">（不选）</option>${(d.entries || []).map((e) => `<option value="${esc(e.entry)}" ${quota.downgrade_to === e.entry ? "selected" : ""}>${esc(e.label)}</option>`).join("")}</select></label>
      </div>
      <div class="actions"><button class="btn primary" id="cost-save-quota">保存额度</button></div></div>

    <div class="card panel"><div style="display:flex;align-items:center;gap:10px"><b>单价</b>
        <span class="muted small" style="margin-left:auto" id="sync-note">同步只补没有单价的模型；核对过的、手动的不动</span>
        <button class="btn sm" id="cost-sync">同步单价</button></div>
      <div id="sync-pending"></div><p class="muted small" style="margin:4px 0 0">每百万 token 的价格。模型名可以写多个（逗号分隔），支持 * 通配。时段：星期写 workday（工作日，按下面的节假日和调休）、weekend、all 或 1-5；时间写 09:00-12:00,14:00-18:00，可以跨午夜。
      命中第一个时段就用它的价格，都不命中用这一行的价格。</p>
      <div id="cost-prices"></div>
      <div class="actions"><button class="btn" id="cost-add">＋ 加一个模型</button><button class="btn primary" id="cost-save-prices">保存单价</button></div></div>

    <div class="card panel"><b>日历</b><p class="muted small" style="margin:4px 0 10px">「工作日」时段按这里算：法定节假日当天算休息日（DeepSeek 等按空闲价），调休上班的周末算工作日。每行一个日期，格式 2026-10-01。</p>
      <div class="price-row" style="grid-template-columns: 1fr 1fr 1fr">
        <label>法定节假日<textarea class="in" rows="5" data-s="holidays">${esc(st.holidays)}</textarea></label>
        <label>调休上班日<textarea class="in" rows="5" data-s="workdays">${esc(st.workdays)}</textarea></label>
        <label>时区<input class="in" data-s="timezone" value="${esc(st.timezone)}">
          <span style="margin-top:10px"><input type="checkbox" data-s="count_claude_code" ${st.count_claude_code ? "checked" : ""}> 统计 Claude Code 报的费用</span></label>
      </div>
      <div class="actions"><button class="btn danger" id="cost-clear">清空全部费用记录</button><button class="btn primary" id="cost-save-settings">保存日历</button></div></div>`;

  const drawPrices = () => {
    $("cost-prices").innerHTML = prices.map((r, i) => `<div class="price-rule" data-i="${i}">
      <div class="price-row">
        <label>模型名<input class="in" data-k="match" value="${esc(r.match)}" placeholder="deepseek-flash, deepseek-v4-flash"></label>
        <label>显示名<input class="in" data-k="label" value="${esc(r.label || "")}"></label>
        <label>币种<select class="in" data-k="currency">${Object.keys(d.currencies).map((c) => `<option ${r.currency === c ? "selected" : ""}>${c}</option>`).join("")}</select></label>
        <label>输入（未命中）<input class="in" data-k="input" type="number" min="0" step="any" value="${r.input}"></label>
        <label>输入（缓存命中）<input class="in" data-k="cache_hit" type="number" min="0" step="any" value="${r.cache_hit}"></label>
        <label>输出<input class="in" data-k="output" type="number" min="0" step="any" value="${r.output}"></label>
        <button class="btn" data-del>删除</button>
      </div>
      ${(r.tiers || []).map((t, j) => `<div class="tier-row" data-j="${j}">
        <label>时段名<input class="in" data-t="name" value="${esc(t.name)}"></label>
        <label>星期<input class="in" data-t="days" value="${esc(t.days)}"></label>
        <label>时间<input class="in" data-t="hours" value="${esc(t.hours)}"></label>
        <label>输入<input class="in" data-t="input" type="number" min="0" step="any" value="${t.input}"></label>
        <label>缓存命中<input class="in" data-t="cache_hit" type="number" min="0" step="any" value="${t.cache_hit}"></label>
        <label>输出<input class="in" data-t="output" type="number" min="0" step="any" value="${t.output}"></label>
        <button class="btn" data-tdel>删除</button></div>`).join("")}
      <div class="muted small" style="margin-top:8px">${r.source ? `<span class="pill warn">${esc(r.source)} 同步 · ${esc(r.provider || "")} · ${esc(r.synced_at || "")}</span> ` : r.checked ? '<span class="pill ok">已核对</span> ' : '<span class="pill">手动</span> '}${r.checked ? "核对：" + esc(r.checked) + " · " : ""}<a href="#" data-tadd>＋ 加一个时段</a>（比如高峰价、夜间价）</div>
    </div>`).join("") || '<p class="muted small">没有单价：所有请求费用按 0 算</p>';
    $("cost-prices").querySelectorAll(".price-rule").forEach((el) => {
      const r = prices[+el.dataset.i];
      el.querySelectorAll("[data-k]").forEach((inp) => (inp.oninput = () => { r[inp.dataset.k] = inp.type === "number" ? +inp.value : inp.value; delete r.source; }));   // 手改过：变成手动的，同步不再动它
      el.querySelectorAll(".tier-row").forEach((row) => {
        const t = r.tiers[+row.dataset.j];
        row.querySelectorAll("[data-t]").forEach((inp) => (inp.oninput = () => { t[inp.dataset.t] = inp.type === "number" ? +inp.value : inp.value; }));
        row.querySelector("[data-tdel]").onclick = () => { r.tiers.splice(+row.dataset.j, 1); drawPrices(); };
      });
      el.querySelector("[data-del]").onclick = () => { prices.splice(+el.dataset.i, 1); drawPrices(); };
      el.querySelector("[data-tadd]").onclick = (e) => {
        e.preventDefault();
        (r.tiers = r.tiers || []).push({ name: "高峰", days: "workday", hours: "09:00-12:00,14:00-18:00", input: r.input, cache_hit: r.cache_hit, output: r.output });
        drawPrices();
      };
    });
  };
  drawPrices();
  const drawPending = (pending) => {
    const items = Object.entries(pending || {});
    $("sync-pending").innerHTML = items.length ? `<div class="banner warn" style="margin:10px 0 0">这些模型在官方名下没找到，下面是各来源里同名的候选（转售商的价格可能不一样），确认后点「用这个」：
      ${items.map(([m, cs]) => `<div style="margin-top:6px"><b>${esc(m)}</b>：${cs.map((c, i) => `${esc(c.source)}/${esc(c.provider)} $${c.prices.input} / $${c.prices.cache_hit} / $${c.prices.output} <a href="#" data-accept="${esc(m)}" data-i="${i}">用这个</a>`).join("　")}</div>`).join("")}</div>` : "";
    $("sync-pending").querySelectorAll("[data-accept]").forEach((el) => (el.onclick = (e) => { e.preventDefault(); busy(el, async () => {
      try { await api("billing/prices/accept", { model: el.dataset.accept, index: +el.dataset.i }); toast("已加上，之后的请求按这个单价算"); page.dirty = null; openPage("cost", true); }
      catch (err) { toast(err.message, true); } }); }));
  };
  drawPending(costPending);
  $("cost-sync").onclick = (e) => busy(e.currentTarget, async () => {
    if (page.dirty && page.dirty() && !confirm("单价有没保存的修改，同步会按已保存的单价来，确定吗？")) return;
    $("sync-note").textContent = "正在问 models.dev、LiteLLM、OpenRouter…";
    try {
      const r = await api("billing/prices/sync", {});
      costPending = r.pending;
      toast(`查了 ${r.checked} 个模型：加了 ${r.added.length} 个，更新 ${r.updated.length} 个，${Object.keys(r.pending).length} 个待确认${r.failed.length ? "；没连上：" + r.failed.join("、") : ""}`);
      page.dirty = null; openPage("cost", true);
    } catch (err) { $("sync-note").textContent = err.message; }
  });
  root.querySelectorAll("[data-q]").forEach((inp) => (inp.oninput = inp.onchange = () => { quota[inp.dataset.q] = inp.type === "number" ? +inp.value : inp.value; }));
  root.querySelectorAll("[data-s]").forEach((inp) => (inp.oninput = inp.onchange = () => { st[inp.dataset.s] = inp.type === "checkbox" ? inp.checked : inp.value; }));
  $("cost-add").onclick = () => { prices.push({ match: "", label: "", currency: "CNY", input: 0, cache_hit: 0, output: 0, tiers: [] }); drawPrices(); };
  const save = (btn, body, msg) => busy(btn, async () => { await api("billing", body); page.dirty = null; toast(msg); openPage("cost", true); });
  $("cost-save-prices").onclick = (e) => save(e.currentTarget, { prices }, "单价已保存，之后的请求按新单价算");
  $("cost-save-quota").onclick = (e) => save(e.currentTarget, { quota }, "额度已保存，下一次提问就按新额度检查");
  $("cost-save-settings").onclick = (e) => save(e.currentTarget, { settings: {
    timezone: st.timezone, count_claude_code: !!st.count_claude_code,
    holidays: st.holidays.split(/\s+/).filter(Boolean), workdays: st.workdays.split(/\s+/).filter(Boolean) } }, "已保存");
  $("cost-clear").onclick = (e) => { if (confirm("清空全部费用记录？今天、本月、累计都会从 0 开始，额度也按 0 重新算。")) busy(e.currentTarget, async () => { await api("billing/clear", {}); toast("费用记录已清空"); openPage("cost", true); }); };
}

async function renderCallNames(root) {
  const d = await api("call-names");
  let models = d.models.map((m) => ({ ...m, aliases: [...m.aliases] }));
  let learning = d.learning, devices = d.devices;
  const labelOf = (entry) => (d.targets.find((t) => t.entry === entry) || models.find((m) => m.entry === entry) || { label: entry }).label;
  setOnline(devices);
  root.innerHTML = `
    <div class="page-head"><div><h1>称呼</h1><p class="sub">设备醒了以后，句子开头说“嗨 + 称呼”，就换成对应的模型或智能体回答；之后直接说话也交给它，直到叫别的称呼。每个模型只记得跟自己的对话。
      只说称呼时只切换、回一声“${esc(d.reply)}”，不启动模型；说出第一句话时才启动。完整经过见<a href="#how">工作原理</a>。</p></div>
      <span class="pill ${d.enabled ? "ok" : ""}">${d.enabled ? "已开启" : "已关闭"}</span></div>
    <div class="card panel cn-say">
      <div class="seg ww"><span class="tag">唤醒词 · 在设备上改</span><b>小麦小麦</b><small>叫醒设备、开始听；设备本地识别。在设备屏幕「设置 → 唤醒词」改，每台设备各自的</small></div>
      <i aria-hidden="true">→</i>
      <div class="seg cn"><span class="tag">称呼 · 在这页改</span><b>嗨 ${esc((d.models.find((m) => m.ready && m.aliases.length) || { aliases: ["DSH"] }).aliases[0])}，</b><small>点名谁来回答，可以不说；网关识别后去掉。所有设备共用这张称呼表</small></div>
      <i aria-hidden="true">→</i>
      <div class="seg rest"><span class="tag">要说的话</span><b>帮我看看明天要不要带伞</b><small>交给叫到的模型回答</small></div>
    </div>
    <div class="card panel">
      <label class="switch" style="margin-top:0"><input type="checkbox" id="cn-enabled" ${d.enabled ? "checked" : ""}><span>开启称呼</span>
        <small>关闭后，“嗨 + 称呼”会当作普通的话交给当前模型</small></label>
      <label class="f" style="margin-top:16px">只说称呼时的回复<span class="hint">只说“嗨 + 称呼”时，服务端切换模型后直接回这句，不启动模型。越短越快，中间的标点会去掉、一次播完</span>
        <input class="in" id="cn-reply" value="${esc(d.reply)}" maxlength="40"></label>
      <p class="muted small" style="margin:12px 0 0">语音识别常把称呼听成别的写法（比如 Claude 会听成 cloud），每种写法都要列出来。开头的“${esc(d.prefixes.join(" / "))}”不用写。设备第一次连上时用后台默认的模型（${esc(labelOf(d.default) || d.default || "未设置")}），之后记住每台设备上次叫的模型。</p>
    </div>
    <div id="cn-models"></div>
    <div class="card panel" id="cn-add-box" style="margin-top:16px"></div>
    <div class="actions"><span class="result muted">保存后马上生效，不用重启服务。</span><button class="btn primary" id="cn-save">保存</button></div>`;

  const allAliases = () => models.flatMap((m) => m.aliases);
  // 没装的本机 CLI：称呼可以挪给默认模型（默认模型配好了才行）
  const moveTo = (m) => { const t = d.targets.find((x) => x.entry === d.default); return t && t.entry !== m.entry ? t : null; };
  const findModel = (entry) => models.find((m) => m.entry === entry);
  const addAlias = (m, a) => {
    a = String(a || "").trim().toLowerCase();
    if (!a) return;
    const owner = models.find((x) => x.aliases.includes(a));
    if (owner && owner !== m) { toast(`“${a}”已经是 ${owner.label} 的称呼`, true); return; }
    if (!m.aliases.includes(a)) m.aliases.push(a);
  };

  const learnHtml = (m) => {
    const mine = learning.target === m.entry;
    const samples = mine ? learning.samples || [] : [];
    const say = esc(m.aliases[0] || m.label);
    let html = "";
    if (mine && learning.active) {
      html = `<div class="banner info" style="margin:12px 0">正在录入：先唤醒设备，再说“嗨 ${say}”，每说一遍等设备回答“收到”再说下一遍。
        已录 ${samples.length}/${learning.count} 遍，还剩 ${learning.seconds_left} 秒。</div>
        <button class="btn sm" data-stop>停止录入</button>`;
    } else if (learning.active) {
      html = '<p class="muted small" style="margin:12px 0 0">正在给别的模型录入，录完再来。</p>';
    } else if (!devices.length) {
      html = '<p class="muted small" style="margin:12px 0 0">用设备录入：没有设备在线。先唤醒设备，再刷新本页。</p>';
    } else {
      html = `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px">
          ${devices.length > 1 ? `<select class="in" data-device style="max-width:280px">${devices.map((x) => `<option value="${esc(x.session_id)}">${esc(x.device_id || x.session_id)}（${esc(x.ip || "")}）</option>`).join("")}</select>` : ""}
          <button class="btn sm" data-learn>用设备录入</button>
          <span class="muted small">对着设备说 3 遍“嗨 + 称呼”，按你的发音记下语音识别听到的写法；录入期间的话不会交给模型</span></div>`;
    }
    if (samples.length) {
      html += `<div class="section-title" style="margin-top:16px">录到的结果</div>
        ${samples.map((x, i) => {
          const ok = x.alias && x.alias.length >= 2;
          const dup = allAliases().includes(x.alias);
          return `<label class="switch" style="margin-top:6px"><input type="checkbox" data-sample="${i}" ${ok && !dup ? "checked" : ""} ${ok ? "" : "disabled"}>
            <span>第 ${i + 1} 遍：识别为“${esc(x.text)}”→ 称呼 <b>${esc(x.alias || "（没听出称呼）")}</b></span>${dup ? "<small>已在列表里</small>" : ""}</label>`;
        }).join("")}
        <div class="actions" style="justify-content:flex-start"><button class="btn sm" data-take>把勾选的加入称呼</button></div>`;
    }
    return html;
  };

  const draw = () => {
    $("cn-models").innerHTML = models.map((m, mi) => `
      <div class="card" data-model="${mi}" style="margin-top:16px">
        <div class="card-head"><h2 class="with-logo">${logoTile(m.logo, m.label, "md")}${esc(m.label)}</h2><span>
          ${m.entry === d.default ? '<span class="pill ai">默认模型</span>' : ""}
          ${m.missing ? `<span class="pill err">网关上没装 ${esc(m.missing)}</span>` : m.ready ? "" : '<span class="pill err">还没配置好</span>'}</span></div>
        <div class="panel" style="padding-top:12px">
          <div class="chips">${m.aliases.length ? m.aliases.map((a, i) => `<span class="chip on">${esc(a)}
            <button class="chip-x" data-del="${i}" title="删除" aria-label="删除 ${esc(a)}">×</button></span>`).join("")
            : '<span class="muted small">还没有称呼</span>'}</div>
          <div style="display:flex;gap:8px;margin-top:12px;max-width:440px">
            <input class="in" data-new placeholder="手动添加一种写法"><button class="btn sm" data-add>添加</button></div>
          ${m.missing ? `<div class="banner err" style="margin:12px 0 0">网关上找不到 ${esc(m.missing)} 的命令：说“嗨 ${esc(m.aliases[0] || "")}”时设备会回“网关上没装 ${esc(m.missing)}”，不切换。${moveTo(m) ? `想用 ${esc(moveTo(m).label)} 回答，把称呼挪过去；` : ""}想用 ${esc(m.missing)}，先在网关上装好。</div>` : ""}
          <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
            ${m.missing && moveTo(m) && m.aliases.length ? `<button class="btn sm" data-move>挪给 ${esc(moveTo(m).label)}</button>` : ""}
            <button class="btn sm" data-remove>不再呼叫这个模型</button></div>
          <div data-learnbox>${learnHtml(m)}</div>
        </div>
      </div>`).join("") || '<div class="card panel" style="margin-top:16px"><p class="muted" style="margin:0">还没有给任何模型配称呼。</p></div>';

    $("cn-models").querySelectorAll("[data-model]").forEach((card) => {
      const m = models[+card.dataset.model];
      const q = (sel) => card.querySelector(sel);
      card.querySelectorAll("[data-del]").forEach((b) => (b.onclick = () => { m.aliases.splice(+b.dataset.del, 1); draw(); }));
      q("[data-add]").onclick = () => { addAlias(m, q("[data-new]").value); draw(); };
      q("[data-new]").onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); q("[data-add]").click(); } };
      q("[data-remove]").onclick = () => { models = models.filter((x) => x !== m); draw(); };
      if (q("[data-move]")) q("[data-move]").onclick = () => {
        const t = moveTo(m);
        let target = findModel(t.entry);
        if (!target) { target = { entry: t.entry, label: t.label, aliases: [], ready: true, missing: "" }; models.push(target); }
        target.aliases.push(...m.aliases.filter((a) => !target.aliases.includes(a)));
        models = models.filter((x) => x !== m); draw(); toast(`已挪给 ${t.label}，记得点保存`);
      };
      if (q("[data-learn]")) q("[data-learn]").onclick = (e) => busy(e.target, async () => {
        try {
          learning = (await api("call-names/learn", { session_id: q("[data-device]") ? q("[data-device]").value : "", target: m.entry })).learning;
          draw(); poll();
        } catch (err) { toast(err.message, true); }
      });
      if (q("[data-stop]")) q("[data-stop]").onclick = async () => { learning = (await api("call-names/learn/stop", {})).learning; draw(); };
      if (q("[data-take]")) q("[data-take]").onclick = () => {
        card.querySelectorAll("[data-sample]:checked").forEach((c) => addAlias(m, learning.samples[+c.dataset.sample].alias));
        draw(); toast("已加入列表，记得点保存");
      };
    });

    const left = d.targets.filter((t) => !findModel(t.entry));
    $("cn-add-box").innerHTML = left.length
      ? `<div class="section-title" style="margin-top:0">再呼叫一个模型</div>
         <div style="display:flex;gap:8px;max-width:440px"><select class="in" id="cn-pick">${left.map((t) => `<option value="${esc(t.entry)}">${esc(t.label)}</option>`).join("")}</select>
         <button class="btn sm" id="cn-add-model">添加</button></div>
         <p class="muted small" style="margin:8px 0 0">只能选已经配置好的模型。要加别的厂商，先到“大模型”页填好接口地址、模型和 API Key。</p>`
      : `<p class="muted small" style="margin:0">已配置好的模型都加上了。要加别的厂商，先到“大模型”页填好接口地址、模型和 API Key。</p>`;
    if ($("cn-add-model")) $("cn-add-model").onclick = () => {
      const t = d.targets.find((x) => x.entry === $("cn-pick").value);
      const m = { entry: t.entry, label: t.label, aliases: [], ready: true };
      models.push(m);
      t.defaults.filter((a) => !allAliases().includes(a)).forEach((a) => addAlias(m, a));  // 已被别的模型占用的跳过
      draw();
    };
  };
  const poll = () => {
    clearInterval(page.timer);
    page.timer = setInterval(async () => {
      try { const r = await api("call-names", undefined, true); learning = r.learning; devices = r.devices; setOnline(devices); } catch (e) { onDevicesError(e); return; }
      draw();
      if (!learning.active) { clearInterval(page.timer); page.timer = null; }
    }, 1500);
  };

  draw();
  if (learning.active) poll();
  const values = () => ({ enabled: $("cn-enabled").checked, reply: $("cn-reply").value.trim(),
    models: models.map((m) => ({ entry: m.entry, aliases: m.aliases })) });
  page.dirty = snapshot(values);
  $("cn-save").onclick = (e) => busy(e.target, async () => {
    try { const r = await api("call-names", values()); toast(r.note); page.dirty = null; await openPage("calls", true); }
    catch (err) { toast(err.message, true); }
  });
}

// ---------- 更新网关 ----------

const fmtTime = (v) => (v ? new Date(typeof v === "number" ? v * 1000 : v).toLocaleString() : "");
// 版本只显示时间和短提交号，不显示提交说明（用户定）
const commitLine = (c) => c && c.short ? `${esc(fmtTime(c.date))} <span class="muted small">（${esc(c.short)}）</span>` : '<span class="muted">未知</span>';
const UPDATE_NOTE = "更新期间网关会重启，一般 1～2 分钟，在线设备会断开一下再自动连上，正在进行的对话会中断。";

async function renderUpdate(root) {
  const d = await api("update");
  if (d.update.state === "running") return renderUpdating(root, d.update);
  const src = d.source || {};
  root.innerHTML = `
    <div class="page-head"><div><h1>更新网关</h1><p class="sub">和 GitHub 上的版本比较，有新版本时由你决定什么时候更新，不会自动更新。</p></div>
      ${d.unsupported ? "" : '<button class="btn" id="up-check">检查更新</button>'}</div>
    ${d.unsupported ? `<div class="banner warn">${esc(d.unsupported)}</div>` : ""}
    <div class="card panel"><div class="kv two">
      <div class="k">当前版本</div><div>${commitLine(d.current)}</div>
      ${d.running && d.running.short ? `<div class="k">运行中</div><div>${commitLine(d.running)} <span class="pill warn">和当前版本不一样，重启服务后才换成当前版本</span></div>` : ""}
      ${d.branch ? `<div class="k">分支</div><div><code>${esc(d.branch)}</code></div>` : ""}
      ${src.url ? `<div class="k">更新来源</div><div><code>${esc(src.url)}</code> 的 <code>${esc(src.branch)}</code> 分支</div>` : ""}
    </div></div>
    <div id="up-last"></div>
    ${d.unsupported ? "" : '<div class="section-title">新版本</div><div class="card" id="up-box"></div>'}`;
  renderLastUpdate(d.update);
  if (d.unsupported) return;
  const check = () => busy($("up-check"), async () => {
    $("up-box").innerHTML = '<div class="panel muted">正在和 GitHub 比较…（网络不好时最多等 30 秒）</div>';
    try { drawCheck(root, (await api("update/check", {})).check); }
    catch (e) { $("up-box").innerHTML = `<div class="panel"><div class="banner err" style="margin:0">${esc(e.message)}</div></div>`; }
  });
  $("up-check").onclick = check;
  // 打开这一页时，十分钟内没检查过就自动查一次（只查不更新）
  if (d.check && Date.now() / 1000 - d.check.checked_at < 600) drawCheck(root, d.check);
  else check();
}

function renderLastUpdate(u) {
  const box = $("up-last");
  if (!box || !u || u.state === "idle" || u.state === "running") return;
  const when = fmtTime(u.finished || u.started);
  let html = "";
  if (u.state === "done") {
    html = u.changed
      ? `<div class="banner info">${esc(when)} 更新成功：${esc(u.from.short || "")} → ${esc(u.to.short || "")}。</div>`
      : `<div class="banner info">${esc(when)} 检查过，已经是最新版本，没有改动。</div>`;
    if (u.restart_needed) html += '<div class="banner warn">代码已更新，但服务是手动启动的，没有自动重启：请在运行网关的终端按 Ctrl+C 停止，再运行 scripts/start.sh。</div>';
  } else {
    html = `<div class="banner ${u.state === "failed" ? "err" : "warn"}">${esc(when)} 更新没有完成：${esc(u.error || "")}${u.changed ? "" : "。网关仍是原来的版本"}</div>`;
  }
  // 没成功时展开输出：原因（如"按上面的提示处理"）就在里面
  if (u.log && u.log.length) html += `<details class="adv" style="margin:0 0 14px;padding:0;border:0" ${u.state === "done" ? "" : "open"}><summary>更新输出</summary><pre class="update-log">${esc(u.log.join("\n"))}</pre></details>`;
  box.style.marginTop = "14px";
  box.innerHTML = html;
}

function drawCheck(root, c) {
  const box = $("up-box");
  if (!box) return;
  const when = c.checked_at ? `<span class="muted small">检查于 ${esc(fmtTime(c.checked_at))}</span>` : "";
  if (c.state === "latest") {
    box.innerHTML = `<div class="card-head"><h2><span class="pill ok">已经是最新版本</span></h2>${when}</div><div class="panel muted">远端最新：${commitLine(c.latest)}</div>`;
  } else if (c.state === "available" || c.state === "dirty") {
    box.innerHTML = `<div class="card-head"><h2>有新版本</h2>${when}</div><div class="panel">最新版本：${commitLine(c.latest)}</div>
      <div class="panel" style="border-top:1px solid var(--line)">
        ${c.state === "dirty" ? `<div class="banner warn">${esc(c.message)}<br><code>${esc((c.files || []).join("  "))}</code></div>`
          : `<p class="muted small" style="margin:0 0 4px">${UPDATE_NOTE}依赖有变化时会自动补装；补装失败或新版本起不来时自动退回现在的版本。</p>`}
        <div class="actions" style="margin-top:10px"><button class="btn primary" id="up-start" ${c.state === "dirty" ? "disabled" : ""}>立即更新</button></div></div>`;
    if (c.state === "available") $("up-start").onclick = (e) => busy(e.target, async () => {
      if (!confirm("现在更新网关吗？\n\n" + UPDATE_NOTE)) return;
      try { renderUpdating(root, (await api("update/start", {})).update); }
      catch (err) { toast(err.message, true); }
    });
  } else {
    const cls = c.state === "error" ? "err" : "warn";
    box.innerHTML = `<div class="panel"><div class="banner ${cls}" style="margin:0">${esc(c.message)}</div>${when ? `<p style="margin:8px 0 0">${when}</p>` : ""}</div>`;
  }
}

// 更新中：每 2 秒查一次进度。网关重启期间连不上是正常的，等它回来；结束后成功就刷新整页（页面本身也可能更新了）
function renderUpdating(root, u) {
  root.innerHTML = `
    <div class="page-head"><div><h1>更新网关</h1><p class="sub">正在更新，请不要关闭网关或断电。</p></div></div>
    <div class="card panel">
      <div class="banner info">正在更新，网关会重启，一般 1～2 分钟。在线设备会断开一下再自动连上，这个页面会自动恢复。</div>
      <p style="margin:0">当前步骤：<b id="up-step">准备中</b> <span class="muted small" id="up-elapsed"></span></p>
      <details class="adv"><summary>更新输出</summary><pre class="update-log" id="up-log"></pre></details>
    </div>`;
  const started = (u.started || Date.now() / 1000) * 1000;
  let down = false;
  const show = (st) => {
    $("up-step").textContent = down ? "网关正在重启，等它回来…" : (st && st.step) || "准备中";
    const sec = Math.round((Date.now() - started) / 1000);
    $("up-elapsed").textContent = `已用 ${sec} 秒` + (sec > 150 ? "。新版本启动得比较慢，5 分钟内起不来会自动退回原来的版本" : "");
    if (st && st.log) $("up-log").textContent = st.log.join("\n");
  };
  show(u);
  clearInterval(page.timer);
  page.timer = setInterval(async () => {
    if (!$("up-step")) return;
    let d;
    try { d = await api("update", undefined, true); down = false; }
    catch (e) { if (isOffline(e)) { down = true; show(null); } return; }
    if (d.update.state === "running") return show(d.update);
    clearInterval(page.timer); page.timer = null;
    if (d.update.state === "done" && d.update.changed && !d.update.restart_needed) {
      toast(`已更新到 ${d.update.to.short}，页面马上刷新`);
      setTimeout(() => location.reload(), 1500);
    } else {
      await openPage("update", true);
    }
  }, 2000);
}

// 拖动排序一组元素（菜单顺序、表格的行）：放下后按新顺序回调 data-p / data-row 的值
function dragList(box, selector, done) {
  let dragged = null;
  box.querySelectorAll(selector).forEach((el) => {
    el.draggable = true;
    el.ondragstart = (e) => { dragged = el; el.classList.add("drag"); e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", ""); };
    el.ondragend = () => { el.classList.remove("drag"); box.querySelectorAll(".over").forEach((x) => x.classList.remove("over")); };
    el.ondragover = (e) => { if (dragged && dragged !== el) { e.preventDefault(); box.querySelectorAll(".over").forEach((x) => x.classList.remove("over")); el.classList.add("over"); } };
    el.ondrop = (e) => {
      e.preventDefault();
      if (!dragged || dragged === el) return;
      el.parentNode.insertBefore(dragged, el);
      done([...box.querySelectorAll(selector)].map((x) => x.dataset.p ?? x.dataset.row));
    };
  });
}

function enhanceTable(table, key) {

  table.dataset.dt = key;
  table.classList.add("dt");

  const save = () => { const a = store.get(TABLE_KEY, {}); a[key] = st; store.set(TABLE_KEY, a); };
  const rows = () => [...table.querySelectorAll("tr")].slice(1);
  const labelOf = (th) => th.dataset.label || (th.dataset.label = th.textContent.trim());
  // 行首的拖动把手
  const h = document.createElement("th"); h.className = "h"; head.insertBefore(h, head.firstChild);
  rows().forEach((tr) => {
    tr.dataset.row = (tr.children[0] ? tr.children[0].textContent.trim() : "");
    const td = document.createElement("td"); td.className = "h"; td.textContent = "⋮⋮"; td.title = "拖动调整顺序"; tr.insertBefore(td, tr.firstChild);
  });
  const ths = () => [...head.children].slice(1);
  // 列顺序
  if (st.order) {
    const want = st.order.filter((l) => ths().some((th) => labelOf(th) === l));
    want.forEach((l, i) => {
      const from = ths().findIndex((th) => labelOf(th) === l) + 1;
      [head, ...rows()].forEach((tr) => { const c = tr.children[from]; if (c) tr.insertBefore(c, tr.children[i + 1] || null); });
    });
  }
  // 行顺序（手动）
  const body = head.parentNode;
  if (st.rows && !st.sort) {
    st.rows.forEach((k) => { const tr = rows().find((r) => r.dataset.row === k); if (tr) body.appendChild(tr); });
  }
  // 排序
  const original = rows();
  const sortNow = () => {
    table.classList.toggle("sorted", !!st.sort);
    ths().forEach((th) => { th.querySelector(".so")?.remove(); });
    if (!st.sort) { original.forEach((tr) => body.appendChild(tr)); if (st.rows) st.rows.forEach((k) => { const tr = rows().find((r) => r.dataset.row === k); if (tr) body.appendChild(tr); }); return; }
    const idx = ths().findIndex((th) => labelOf(th) === st.sort.col) + 1;
    if (idx < 1) { st.sort = null; return sortNow(); }
    const th = ths()[idx - 1];
    th.insertAdjacentHTML("beforeend", `<span class="so">${st.sort.dir > 0 ? "▲" : "▼"}</span>`);
    rows().sort((a, b) => {
      const x = cellValue(a.children[idx]), y = cellValue(b.children[idx]);
      return (typeof x === "number" && typeof y === "number" ? x - y : String(x).localeCompare(String(y), "zh")) * st.sort.dir;
    }).forEach((tr) => body.appendChild(tr));
  };
  // 列宽：先按现在的样子量好，固定下来
  const widths = ths().map((th) => th.getBoundingClientRect().width);
  const cg = document.createElement("colgroup");
  cg.innerHTML = '<col style="width:24px">' + ths().map((th, i) => `<col data-l="${esc(labelOf(th))}" style="width:${(st.widths && st.widths[labelOf(th)]) || Math.max(60, Math.round(widths[i]))}px">`).join("");
  table.insertBefore(cg, table.firstChild);
  if (!st.widths) { cg.querySelectorAll("col[data-l]").forEach((c) => (c.style.width = "")); table.style.tableLayout = "auto"; }
  ths().forEach((th) => {
    const rz = document.createElement("span"); rz.className = "rz"; th.appendChild(rz);
    rz.onmousedown = (e) => {
      e.preventDefault(); e.stopPropagation();
      // 第一次调宽：把所有列定成现在的像素宽度
      if (!st.widths) { st.widths = {}; ths().forEach((x) => (st.widths[labelOf(x)] = Math.round(x.getBoundingClientRect().width))); table.style.tableLayout = "";
        cg.querySelectorAll("col[data-l]").forEach((c) => (c.style.width = st.widths[c.dataset.l] + "px")); }
      const col = cg.querySelector(`col[data-l="${CSS.escape(labelOf(th))}"]`), x0 = e.clientX, w0 = st.widths[labelOf(th)];
      const move = (ev) => { const w = Math.max(48, w0 + ev.clientX - x0); col.style.width = w + "px"; st.widths[labelOf(th)] = w; };
      const up = () => { document.removeEventListener("mousemove", move); document.removeEventListener("mouseup", up); save(); };
      document.addEventListener("mousemove", move); document.addEventListener("mouseup", up);
    };
    th.onclick = (e) => {
      if (e.target.classList.contains("rz")) return;
      const l = labelOf(th);
      st.sort = !st.sort || st.sort.col !== l ? { col: l, dir: -1 } : st.sort.dir < 0 ? { col: l, dir: 1 } : null;
      save(); sortNow();
    };
    // 拖表头换列
    th.draggable = true;
    th.ondragstart = (e) => { table._dragCol = th; e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", ""); };
    th.ondragover = (e) => { if (table._dragCol && table._dragCol !== th) { e.preventDefault(); th.classList.add("over"); } };
    th.ondragleave = () => th.classList.remove("over");
    th.ondrop = (e) => {
      e.preventDefault(); th.classList.remove("over");
      const from = [...head.children].indexOf(table._dragCol), to = [...head.children].indexOf(th);
      table._dragCol = null;
      if (from < 1 || to < 1 || from === to) return;
      [head, ...rows()].forEach((tr) => { const c = tr.children[from]; if (c) tr.insertBefore(c, tr.children[to]); });
      const c = cg.children[from]; cg.insertBefore(c, cg.children[to]);
      st.order = ths().map(labelOf); save();
    };
  });
  // 拖行
  const rowDrag = () => dragList(body, "tr[data-row]", (keys) => { st.rows = keys; st.sort = null; save(); sortNow(); });
  rows().forEach((tr) => { tr.draggable = false; tr.children[0].onmousedown = () => { if (!st.sort) { rowDrag(); } }; });
  if (!st.sort) rowDrag();
  sortNow();
  if (!table.parentNode.classList.contains("dt-wrap")) { const w = document.createElement("div"); w.className = "dt-wrap"; table.parentNode.insertBefore(w, table); w.appendChild(table); }
}
function enhanceTables(root) {
  root.querySelectorAll("table.cost-table, table.enh").forEach((t) => {
    const head = t.querySelector("tr");
    if (head) enhanceTable(t, `${page.name}:${[...head.querySelectorAll("th")].map((x) => x.textContent.trim()).join("|")}`);
  });
}
new MutationObserver(() => { clearTimeout(enhanceTables.t); enhanceTables.t = setTimeout(() => enhanceTables($("page")), 30); })
  .observe($("page"), { childList: true, subtree: true });
applyUi();

route();
</script>
