<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>小麦对讲</title>
<!-- 视频对讲（设计画布第 51 块）：经 Tailscale 打开，打给家里的小麦。网关只转交呼叫和连接描述，音视频直连。 -->
<style>
  :root { --bg: #f4f6fb; --ink: #141a2e; --ink2: #5b6480; --ink3: #6b7593; --line: #d7dcea; --card: #fff; --ok: #1f9d5c; --bad: #e0384a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #070b18; --ink: #f2f5ff; --ink2: #b6c0e2; --ink3: #939ec7; --line: #ffffff26; --card: #ffffff12; --ok: #2fbf71; --bad: #ff4d5e; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font: 17px/1.6 -apple-system, "PingFang SC", "Noto Sans SC", sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: max(18px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 12px; }
  header { display: flex; align-items: baseline; gap: 10px; } header b { font-size: 22px; } header span { margin-left: auto; font-size: 13px; color: var(--ink3); }
  #devices { display: flex; flex-direction: column; gap: 10px; }
  .dev { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); }
  .dev i { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); flex: none; } .dev i.off { background: var(--ink3); }
  .dev div { flex: 1; min-width: 0; } .dev b { display: block; } .dev small { color: var(--ink3); font-size: 13px; }
  .dev button { flex: none; height: 44px; padding: 0 18px; border-radius: 999px; border: 0; background: var(--ok); color: #fff; font: inherit; font-weight: 700; }
  .dev button:disabled { background: var(--line); color: var(--ink3); }
  .note { font-size: 13px; color: var(--ink3); margin: 6px 2px 0; }
  .err { color: var(--bad); }
  #call { position: fixed; inset: 0; background: #0b0f1f; color: #fff; display: flex; flex-direction: column; }
  #remote { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #0b0f1f; }
  #self { position: absolute; right: 12px; top: max(12px, env(safe-area-inset-top)); width: 96px; height: 128px; object-fit: cover; border-radius: 14px;
    border: 2px solid #fff6; transform: scaleX(-1); background: #222; }
  #status { position: absolute; left: 14px; top: max(14px, env(safe-area-inset-top)); padding: 4px 12px; border-radius: 999px; background: #0008; font-size: 14px; }
  #wait { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 24px; }
  #wait .av { width: 96px; height: 96px; border-radius: 50%; display: grid; place-items: center; font-size: 38px; font-weight: 700; color: #102;
    background: linear-gradient(135deg, #8ff0ff, #8fa6ff); }
  .ctrls { position: absolute; left: 0; right: 0; bottom: max(26px, env(safe-area-inset-bottom)); display: flex; justify-content: center; gap: 20px; }
  .ctrls button { width: 62px; height: 62px; border-radius: 50%; border: 0; background: #ffffff33; color: #fff; font-size: 24px; }
  .ctrls button.on { background: #fff; color: #102; }
  .ctrls .end { background: var(--bad); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main id="list">
  <header><b>小麦对讲</b><span id="me"></span></header>
  <div id="devices"><p class="note">正在读设备…</p></div>
  <p class="note" id="msg"></p>
  <p class="note">只有家里 Tailscale 网络里的手机能打开这一页。第一次打会问能不能用摄像头和麦克风，点「允许」。</p>
</main>
<section id="call" hidden>
  <video id="remote" autoplay playsinline></video>
  <video id="self" autoplay playsinline muted></video>
  <span id="status"></span>
  <div id="wait"><div class="av" id="waitAv"></div><b id="waitTitle"></b><span id="waitSub">等对方接听…</span></div>
  <div class="ctrls">
    <button id="mute" aria-label="静音">🎙</button>
    <button id="cam" aria-label="关摄像头">📷</button>
    <button id="flip" aria-label="换摄像头">🔄</button>
    <button class="end" id="end" aria-label="挂断">✕</button>
  </div>
</section>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let devices = [], pc = null, ws = null, stream = null, facing = "user", talking = null, timer = null, current = null;

async function loadDevices() {
  try {
    const r = await (await fetch("/call/devices", { cache: "no-store" })).json();
    if (!r.ok) throw new Error(r.error || "读不到设备");
    $("me").textContent = r.me;
    devices = r.devices;
    $("devices").innerHTML = devices.length ? devices.map((d) => `<div class="dev"><i class="${d.ready ? "" : "off"}"></i>
      <div><b>${esc(d.name)}</b><small>${d.busy ? "正在通话" : d.ready ? "在线" : "不在线，或者还没升级到能视频对讲的版本"}</small></div>
      <button data-call="${esc(d.id)}" ${d.ready && !d.busy ? "" : "disabled"}>视频通话</button></div>`).join("")
      : '<p class="note">还没有设备。</p>';
  } catch (e) { $("devices").innerHTML = `<p class="note err">${esc(e.message)}</p>`; }
}

async function media() {
  return navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true },
    video: { facingMode: facing, width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 15 } } });
}
// 非 trickle：收齐候选地址再把描述一次发出去（设备那边的 aiortc 也是这样）
function gathered(p) {
  return new Promise((ok) => {
    if (p.iceGatheringState === "complete") return ok();
    const t = setTimeout(ok, 3000);
    p.addEventListener("icegatheringstatechange", () => { if (p.iceGatheringState === "complete") { clearTimeout(t); ok(); } });
  });
}

async function call(id) {
  current = devices.find((d) => d.id === id);
  $("msg").textContent = "";
  try { stream = await media(); } catch (e) { $("msg").innerHTML = '<span class="err">没拿到摄像头和麦克风：在设置里允许 Safari 使用它们，再试一次。</span>'; return; }
  $("list").hidden = true; $("call").hidden = false;
  $("waitAv").textContent = (current.name || "小").slice(0, 1); $("waitTitle").textContent = `正在呼叫 ${current.name}`;
  $("wait").hidden = false; $("waitSub").textContent = "等对方接听…"; $("status").textContent = current.name;
  $("self").srcObject = stream;
  pc = new RTCPeerConnection({ iceServers: [] });
  stream.getTracks().forEach((t) => pc.addTrack(t, stream));
  pc.ontrack = (e) => { $("remote").srcObject = e.streams[0] || new MediaStream([e.track]); };
  pc.onconnectionstatechange = () => {
    if (pc && pc.connectionState === "connected" && !talking) {
      talking = Date.now(); $("wait").hidden = true;
      timer = setInterval(() => { const s = Math.floor((Date.now() - talking) / 1000); $("status").textContent = `${current.name} · ${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; }, 1000);
    }
    if (pc && pc.connectionState === "failed") finish("连不上设备：检查 Tailscale 是否打开了家里的子网");
  };
  await pc.setLocalDescription(await pc.createOffer());
  await gathered(pc);
  ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/call/ws`);
  ws.onopen = () => ws.send(JSON.stringify({ type: "call", device: id, sdp: pc.localDescription.sdp }));
  ws.onmessage = async (e) => {
    const m = JSON.parse(e.data);
    if (m.type === "ringing") $("waitSub").textContent = "响铃中，等对方接听…";
    else if (m.type === "answer") { $("waitSub").textContent = "接通了，正在连…"; await pc.setRemoteDescription({ type: "answer", sdp: m.sdp }); }
    else if (m.type === "ended") finish({ declined: "对方挂断了", busy: "对方正忙", timeout: "没人接", hangup: "通话结束" }[m.reason] || m.error || "通话结束");
  };
  ws.onclose = () => { if (pc) finish("和网关的连接断了"); };
}

function finish(text) {
  if (ws) { try { ws.send(JSON.stringify({ type: "hangup" })); } catch (e) {} ws.onclose = null; ws.close(); ws = null; }
  if (pc) { pc.close(); pc = null; }
  if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; }
  clearInterval(timer); talking = null;
  $("call").hidden = true; $("list").hidden = false;
  $("msg").textContent = text || "";
  loadDevices();
}

$("devices").addEventListener("click", (e) => { const b = e.target.closest("[data-call]"); if (b) call(b.dataset.call); });
$("end").onclick = () => finish("通话结束");
$("mute").onclick = () => { if (!stream) return; const t = stream.getAudioTracks()[0]; t.enabled = !t.enabled; $("mute").classList.toggle("on", !t.enabled); };
$("cam").onclick = () => { if (!stream) return; const t = stream.getVideoTracks()[0]; t.enabled = !t.enabled; $("cam").classList.toggle("on", !t.enabled); };
$("flip").onclick = async () => {
  if (!pc || !stream) return;
  facing = facing === "user" ? "environment" : "user";
  const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 640 }, height: { ideal: 480 } } });
  const t = s.getVideoTracks()[0];
  const sender = pc.getSenders().find((x) => x.track && x.track.kind === "video");
  if (sender) await sender.replaceTrack(t);
  stream.getVideoTracks().forEach((x) => { x.stop(); stream.removeTrack(x); });
  stream.addTrack(t); $("self").srcObject = stream;
};
window.addEventListener("pagehide", () => { if (pc) finish(); });
loadDevices(); setInterval(() => { if (!pc) loadDevices(); }, 15000);
</script>
</body>
</html>
