# DHCP on the USB cable only (thinksmart-usb-net). The computer gets 172.16.42.2-20; no router and
# no DNS on purpose, so it keeps using its own network for the internet.
interface usb0
start 172.16.42.2
end 172.16.42.20
max_leases 8
lease_file /run/thinksmart/usb-udhcpd.leases
auto_time 0
option subnet 255.255.255.0
option lease 86400
