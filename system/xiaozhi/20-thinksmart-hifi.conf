# Quality for anything that has to be resampled (the graph stays at 48 kHz, so only streams at other
# rates, like a phone's 44.1 kHz over Bluetooth): the best sinc, and noise-shaped dither when it goes to
# integer samples. Same file for PipeWire, its clients and pipewire-pulse.
# (idea from fubin0478/thinksmart-view, MIT)
stream.properties = {
    resample.quality = 10
    dither.method    = "wannamaker3"
}
