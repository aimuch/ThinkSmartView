# ThinkSmart kiosk settings. Change with: sudo kiosk-mode url <URL> / sudo kiosk-mode rotation <value>
# Page shown full screen; while it can't be loaded the built-in welcome page is shown
URL="http://127.0.0.1:8090/"
# Panel is natively 800x1280 portrait. Rotation: normal, 90, 180, 270
ROTATION=90
OUTPUT=DSI-1
# Web page GPU acceleration: never | on-demand | always. on-demand needs the patched Mesa
# (mesa/ in this repository); without it add FD_MESA_DEBUG=sysmem to WEBKIT_ENV
GPU="on-demand"
# Extra environment for the browser's WebKit and Mesa. The GPU still composites the page layers
# (GPU= above); SKIA_ENABLE_CPU_RENDERING=1 only makes the CPU paint their contents, because Skia's GPU
# painting draws wrong pixels on this Adreno 506 / freedreno. Tried on the study device 2026-11-20 (client
# 0.1.717, Mesa 25.2.8+thinksmart4, WebKitGTK 2.52.6) with WEBKIT_SKIA_GPU_PAINTING_THREADS=0 under
# sysmem, under GMEM + noscis and under sysmem,nofp16: every one leaves speckles along blurred shadows and
# gradients, a black block in the top-left corner and (GMEM) stale tiles. A full-screen repaint costs about
# 1.8 cores on the CPU and 0.5-1 with GPU painting, at the same ~42 fps; moving, fading and idle pages
# cost the same either way (idle UI ~3-6 %). GPU painting with worker threads froze the page before.
WEBKIT_ENV="FD_MESA_DEBUG=sysmem WEBKIT_FORCE_VBLANK_TIMER=1 WEBKIT_SKIA_ENABLE_CPU_RENDERING=1"
# Where the welcome page's QR code points (install guide)
#HELP_URL="https://github.com/justhalfbit/xiaozhi-hub-server"
#WEBKIT_FEATURES="-UnifyDamagedRegions"   # switch WebKit feature flags (names: WebKit2.Settings.get_all_features())
