name: Capability Matrix

on:
  pull_request:
    paths:
      - "README.md"
      - "README.zh-CN.md"
      - "docs/capabilities.json"
      - "scripts/check_capability_matrix.py"
      - "scripts/test_check_capability_matrix.py"
      - "Tests/Fixtures/miot_coverage_golden.json"
      - ".github/workflows/capability-matrix.yml"
  push:
    paths:
      - "README.md"
      - "README.zh-CN.md"
      - "docs/capabilities.json"
      - "scripts/check_capability_matrix.py"
      - "scripts/test_check_capability_matrix.py"
      - "Tests/Fixtures/miot_coverage_golden.json"
      - ".github/workflows/capability-matrix.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capability-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check capability docs and code anchors
        run: |
          python3 scripts/test_check_capability_matrix.py
          python3 scripts/check_capability_matrix.py
