# GitLab CI for MenuBarMijia. `check` runs on the maintainer's Mac (project runner, shell executor,
# tag `macos`); the `windows` job runs on a GitLab.com hosted Windows runner because that Mac has no
# MSVC toolchain. See docs/agents/issue-tracker.md. GitHub Actions under .github/workflows are not run.
#
# Snapshots are compared: the baselines are recorded on this same Mac (scripts/record_snapshots.sh).

workflow:
  rules:
    # One pipeline per change: merge request pipelines, plus pushes to main. Branch pushes that
    # already have an open MR do not get a second pipeline.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

default:
  tags: [macos]
  interruptible: true

variables:
  GIT_DEPTH: "50"

check:
  stage: test
  timeout: 45m
  variables:
    # launchd starts the runner with a minimal PATH.
    PATH: "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
  script:
    - (cd windows && npm ci --no-audit --no-fund)
    - (cd raycast && npm ci --no-audit --no-fund)
    - bash scripts/check.sh

# Nothing on the `macos` runner can compile windows/src-tauri: the Swift gate only runs the
# TypeScript tests, and macOS has no MSVC toolchain. This job is the only place `cargo test`
# runs, so Rust compile errors and the native URL/credential tests fail before merge. Only
# `windows/src-tauri/` triggers it: `windows/src` is TypeScript, covered by `check`.
windows:
  stage: test
  timeout: 45m
  # GitLab.com hosted Windows runner (Windows 2022, PowerShell, ephemeral VM).
  tags: [saas-windows-medium-amd64]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [windows/src-tauri/**/*, .gitlab-ci.yml]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [windows/src-tauri/**/*, .gitlab-ci.yml]
  before_script:
    # The image preinstalls Node, Python, CMake and VS Build Tools but not Rust. Restore the
    # machine/user PATH first so the macOS entry point cannot leak in.
    - |
      $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('PATH', 'User')
      if (-not (Get-Command cargo -ErrorAction SilentlyContinue)) {
        Invoke-WebRequest -Uri 'https://win.rustup.rs/x86_64' -OutFile "$env:TEMP\rustup-init.exe"
        & "$env:TEMP\rustup-init.exe" -y --default-toolchain stable --profile minimal --no-modify-path
      }
      $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
      cargo --version
  script:
    - cd windows
    - npm ci --no-audit --no-fund
    # `cargo test` compiles tauri::generate_context!, which reads build.frontendDist (../dist).
    - npm run build
    - cargo test --locked --manifest-path src-tauri/Cargo.toml
